00hamo"},"line_id":"life","health":true},"life_short":{"id":"life_short","cat":"form","name":"生命线·比较短","label":"比较短","desc":"生命线在掌心中段就变淡或结束","read":"节奏灵活型：你擅长把精力花在刀刃上，短期冲刺能力强。记得适度休息，状态会更好。","q":null,"line_id":"life","health":true},"life_narrow_arc":{"id":"life_narrow_arc","cat":"form","name":"生命线·弧度小，贴近拇指","label":"弧度小，贴近拇指","desc":"生命线紧贴大鱼际，围出的范围较小","read":"谨慎细致型：做事稳妥，重视安全感，喜欢在熟悉的圈子里深耕。","q":null,"line_id":"life","health":true},"life_shallow":{"id":"life_shallow","cat":"form","name":"生命线·浅浅的、不太明显","label":"浅浅的、不太明显","desc":"线条较浅或较细","read":"温和细腻型：你对环境很敏感，适合规律作息，给自己留一点充电时间。","q":null,"line_id":"life","health":true},"life_forked_end":{"id":"life_forked_end","cat":"form","name":"生命线·末端分叉","label":"末端分叉","desc":"生命线尾端分成两股","read":"两地开花型：传统上说适合在外闯荡，可能有在不同城市、国家生活的经历。","q":null,"line_id":"life","health":true},"life_branch_up":{"id":"life_branch_up","cat":"form","name":"生命线·有向上的支线","label":"有向上的支线","desc":"生命线上有短线向上（朝手指方向）长出","read":"上升期型：支线象征努力有回报，在某个阶段会有明显进步和收获。","q":{"text":"All lines that rise from the line of life are marks of increased power, gains, and successes.","vern":"从生命线向上长出的支线，代表能力提升、有所收获和成功。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part II, Ch. V The Line of Life (p.81)","url":"https://archive.org/details/cheiroslanguageo00hamo"},"line_id":"life","health":true},"life_broken":{"id":"life_broken","cat":"form","name":"生命线·中间有断开","label":"中间有断开","desc":"生命线断成两段，或有一小段缺口","read":"转换期型：人生中会有一次换跑道、换环境的阶段，换完之后常是新的开始。","q":null,"line_id":"life","health":true},"life_chained":{"id":"life_chained","cat":"form","name":"生命线·有锁链状/岛纹","label":"有锁链状/岛纹","desc":"线上有一个个小圈或链条状","read":"细水长流型：某段时间适合放慢节奏、照顾好自己，稳扎稳打更顺利。","q":{"text":"A chained formation in any line is a weak sign","vern":"任何一条线呈锁链状，都表示这方面的力量较弱（网站改写为“需要多一点照顾”）。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part II (Ch. III In Relation to the Lines)","url":"https://archive.org/details/cheiroslanguageo00hamo"},"line_id":"life","health":true},"life_double":{"id":"life_double","cat":"form","name":"生命线·旁边有一条平行线","label":"旁边有一条平行线","desc":"生命线内侧还有一条平行的副线（火星线）","read":"双倍电池型：后劲足，压力越大越能扛。","q":{"text":"The line of Mars (Plate XIII.) is otherwise known as the inner vital or inner life line. It rises on the Mount of Mars, and sweeps down by the side of the line of life","vern":"火星线又叫“内生命线”，从火星丘起，沿着生命线内侧往下走。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part II, Ch. VI The Line of Mars (p.86)","url":"https://archive.org/details/cheiroslanguageo00hamo"},"line_id":"life","health":true},"head_long_straight":{"id":"head_long_straight","cat":"form","name":"智慧线（头脑线）·长而平直","label":"长而平直","desc":"横贯掌心，几乎是水平直线","read":"理性务实型：逻辑清楚、讲究效率，擅长分析、规划、做决定。","q":{"text":"The line of head (Plate XIII.) relates principally to the mentality of the subject — to the intellectual strength or weakness, to the temperament in its relation to talent, and to the direction and quality of the talent itself.","vern":"头脑线主要反映一个人的思维方式、才智、性情与才华的方向。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part II, Ch. VII The Line of Head (p.87)","url":"https://archive.org/details/cheiroslanguageo00hamo"},"line_id":"head","health":false},"head_sloping":{"id":"head_sloping","cat":"form","name":"智慧线（头脑线）·向下倾斜到小鱼际","label":"向下倾斜到小鱼际","desc":"末端明显向手腕方向弯下去","read":"想象创意型：脑洞大、感受力强，适合写作、设计、艺术等创意工作。","q":null,"line_id":"head","health":false},"head_short":{"id":"head_short","cat":"form","name":"智慧线（头脑线）·比较短","label":"比较短","desc":"在掌心中央附近就结束","read":"专注直接型：想法干脆，抓重点快，行动派。","q":null,"line_id":"head","health":false},"head_joined_life":{"id":"head_joined_life","cat":"form","name":"智慧线（头脑线）·起点与生命线相连","label":"起点与生命线相连","desc":"起点和生命线连在一起一段才分开","read":"稳重周全型：做事三思而后行，谨慎可靠。","q":null,"line_id":"head","health":false},"head_separate_life":{"id":"head_separate_life","cat":"form","name":"智慧线（头脑线）·起点与生命线分开","label":"起点与生命线分开","desc":"两条线起点之间有空隙","read":"独立果断型：有主见、敢闯敢试，很早就有自己的想法。","q":null,"line_id":"head","health":false},"head_forked_end":{"id":"head_forked_end","cat":"form","name":"智慧线（头脑线）·末端分叉（作家叉）","label":"末端分叉（作家叉）","desc":"尾端分成两股","read":"左右脑并用型：既能理性分析又有创意，西方俗称“作家叉”，表达能力好。","q":null,"line_id":"head","health":false},"head_wavy":{"id":"head_wavy","cat":"form","name":"智慧线（头脑线）·弯弯曲曲、起伏","label":"弯弯曲曲、起伏","desc":"线条呈波浪状","read":"灵活多变型：兴趣广泛、点子多，能同时关注很多事。","q":{"text":"纹生断续，易勤易懒；纹生屈曲，多疑多虑。","vern":"纹路断断续续的人，干劲时高时低；纹路弯弯曲曲的人，想得比较多。","src":"《神相全编》卷十（收于《钦定古今图书集成·博物汇编·艺术典》第640卷·相术部汇考十）·相心性","url":"https://zh.wikisource.org/wiki/欽定古今圖書集成/博物彙編/藝術典/第640卷"},"line_id":"head","health":false},"head_chained":{"id":"head_chained","cat":"form","name":"智慧线（头脑线）·有锁链状/岛纹","label":"有锁链状/岛纹","desc":"线上有小圈或链条","read":"深思熟虑型：想得多、想得细，给自己安排专注时段效率更高。","q":{"text":"A chained formation in any line is a weak sign","vern":"任何一条线呈锁链状，都表示这方面的力量较弱（网站改写为“需要多一点照顾”）。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part II (Ch. III In Relation to the Lines)","url":"https://archive.org/details/cheiroslanguageo00hamo"},"line_id":"head","health":false},"heart_to_jupiter":{"id":"heart_to_jupiter","cat":"form","name":"感情线·延伸到食指下","label":"延伸到食指下","desc":"末端到食指根下或食指侧","read":"理想浪漫型：对感情有理想、有标准，重承诺，也很会照顾对方。","q":null,"line_id":"heart","health":false},"heart_to_gap":{"id":"heart_to_gap","cat":"form","name":"感情线·止于食指与中指之间","label":"止于食指与中指之间","desc":"末端落在食指与中指的指缝","read":"平衡温暖型：既感性又理性，对感情真诚踏实，是很好的伴侣和朋友。","q":null,"line_id":"heart","health":false},"heart_to_saturn":{"id":"heart_to_saturn","cat":"form","name":"感情线·止于中指下","label":"止于中指下","desc":"末端停在中指根下方","read":"务实行动型：感情表达直接、实在，用行动表达关心。","q":null,"line_id":"heart","health":false},"heart_long_curved":{"id":"heart_long_curved","cat":"form","name":"感情线·长而上扬","label":"长而上扬","desc":"弧度明显，末端向上翘","read":"热情外放型：情感丰富，乐于表达，爱憎分明，有感染力。","q":null,"line_id":"heart","health":false},"heart_straight":{"id":"heart_straight","cat":"form","name":"感情线·平直","label":"平直","desc":"几乎是横直线","read":"冷静内敛型：情绪稳定，在感情里理性、可靠，不轻易被情绪左右。","q":null,"line_id":"heart","health":false},"heart_forked_end":{"id":"heart_forked_end","cat":"form","name":"感情线·末端分叉","label":"末端分叉","desc":"尾端分成两股或三股","read":"八面玲珑型：情商高，善于理解不同的人，人缘好。","q":null,"line_id":"heart","health":false},"heart_chained":{"id":"heart_chained","cat":"form","name":"感情线·有锁链状/细碎小纹","label":"有锁链状/细碎小纹","desc":"线上有链状或许多小细纹","read":"多愁善感型：心思细腻，共情能力强，记得也多照顾自己的情绪。","q":{"text":"A chained formation in any line is a weak sign","vern":"任何一条线呈锁链状，都表示这方面的力量较弱（网站改写为“需要多一点照顾”）。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part II (Ch. III In Relation to the Lines)","url":"https://archive.org/details/cheiroslanguageo00hamo"},"line_id":"heart","health":false},"heart_short":{"id":"heart_short","cat":"form","name":"感情线·比较短","label":"比较短","desc":"在无名指或中指下方就结束","read":"简单直接型：感情上不绕弯子，喜欢就说，讨厌拖泥带水。","q":null,"line_id":"heart","health":false},"fate_from_wrist_straight":{"id":"fate_from_wrist_straight","cat":"form","name":"事业线（命运线）·从手腕直达中指","label":"从手腕直达中指","desc":"一条清晰的竖线从手腕附近直通中指根下","read":"目标明确型：很早就知道自己要什么，持续努力，稳步上升。","q":{"text":"此为冲天纹，在掌中为天柱，主寿。穿过离宫，直过指节，主富贵。","vern":"这是冲天纹，在掌中像一根天柱；向上穿过离宫、直到手指，主富贵。","src":"《神相全编》卷十（收于《钦定古今图书集成·博物汇编·艺术典》第640卷·相术部汇考十）·相掌善恶","url":"https://zh.wikisource.org/wiki/欽定古今圖書集成/博物彙編/藝術典/第640卷"},"line_id":"fate","health":false},"fate_from_life":{"id":"fate_from_life","cat":"form","name":"事业线（命运线）·从生命线上起","label":"从生命线上起","desc":"起点贴着或长在生命线上","read":"白手起家型：靠自己打拼，越努力越顺。","q":null,"line_id":"fate","health":false},"fate_from_luna":{"id":"fate_from_luna","cat":"form","name":"事业线（命运线）·从小鱼际（月丘）起","label":"从小鱼际（月丘）起","desc":"起点在掌根小指一侧","read":"贵人相助型：人缘好，常得到朋友、客户、公众的支持，适合与人打交道的工作。","q":null,"line_id":"fate","health":false},"fate_from_middle":{"id":"fate_from_middle","cat":"form","name":"事业线（命运线）·从掌心中段起","label":"从掌心中段起","desc":"下半段没有，从掌心附近才开始","read":"大器晚成型：中年以后越来越顺，经验越多越吃香。","q":null,"line_id":"fate","health":false},"fate_broken":{"id":"fate_broken","cat":"form","name":"事业线（命运线）·断断续续","label":"断断续续","desc":"有几段断开或错开","read":"多才多艺型：人生会换几次赛道，每次转换都积累新技能。","q":{"text":"纹生断续，易勤易懒；纹生屈曲，多疑多虑。","vern":"纹路断断续续的人，干劲时高时低；纹路弯弯曲曲的人，想得比较多。","src":"《神相全编》卷十（收于《钦定古今图书集成·博物汇编·艺术典》第640卷·相术部汇考十）·相心性","url":"https://zh.wikisource.org/wiki/欽定古今圖書集成/博物彙編/藝術典/第640卷"},"line_id":"fate","health":false},"fate_faint_none":{"id":"fate_faint_none","cat":"form","name":"事业线（命运线）·很淡或没有","label":"很淡或没有","desc":"看不出明显的竖线","read":"自由随性型：不爱被框住，活得自在，适合灵活、多元的生活方式。","q":null,"line_id":"fate","health":false},"fate_double":{"id":"fate_double","cat":"form","name":"事业线（命运线）·有两条平行线","label":"有两条平行线","desc":"两条竖线并行","read":"双线发展型：能同时兼顾两份事业或主业加爱好。","q":null,"line_id":"fate","health":false},"sun_clear_long":{"id":"sun_clear_long","cat":"form","name":"太阳线·清晰而长","label":"清晰而长","desc":"从掌心一直延伸到无名指下","read":"闪闪发光型：才华容易被看见，人缘好、有名气运。","q":{"text":"The line of sun (Plate XIII.), otherwise called the line of Apollo, the line of brilliancy, or the line of success","vern":"太阳线又叫阿波罗线、光彩线、成功线。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part II, Ch. XII The Line of Sun (p.106)","url":"https://archive.org/details/cheiroslanguageo00hamo"},"line_id":"sun","health":false},"sun_short_top":{"id":"sun_short_top","cat":"form","name":"太阳线·只在无名指下有一小段","label":"只在无名指下有一小段","desc":"短短一截长在无名指根下","read":"晚来红火型：越往后越能享受成就感和别人的认可。","q":null,"line_id":"sun","health":false},"sun_multiple":{"id":"sun_multiple","cat":"form","name":"太阳线·有两三条","label":"有两三条","desc":"无名指下有数条竖线","read":"兴趣多面型：多才多艺，在好几个领域都能发光。","q":null,"line_id":"sun","health":false},"sun_none":{"id":"sun_none","cat":"form","name":"太阳线·没有","label":"没有","desc":"无名指下看不出竖线","read":"低调实干型：不在乎虚名，享受做事本身的乐趣。","q":null,"line_id":"sun","health":false},"marriage_one_clear":{"id":"marriage_one_clear","cat":"form","name":"婚姻线·一条清晰平直","label":"一条清晰平直","desc":"只有一条明显的平直短横纹","read":"专一认真型：对感情重视而专一，相信细水长流。","q":{"text":"The line of marriage on the Mount of Mercury should be straight, without breaks, crosses, or irregularities of any kind.","vern":"水星丘上的婚姻线最好笔直，没有断开、十字或杂乱。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part II, Ch. XVI The Line of Marriage (p.114)","url":"https://archive.org/details/cheiroslanguageo00hamo"},"line_id":"marriage","health":false},"marriage_multiple":{"id":"marriage_multiple","cat":"form","name":"婚姻线·有两三条","label":"有两三条","desc":"有两三条长短不一的横纹","read":"人缘桃花型：异性缘、好人缘都不错，懂得经营关系。","q":null,"line_id":"marriage","health":false},"marriage_up_curve":{"id":"marriage_up_curve","cat":"form","name":"婚姻线·末端上翘","label":"末端上翘","desc":"末端往小指方向翘起","read":"心气很高型：对另一半眼光高，宁缺毋滥。","q":null,"line_id":"marriage","health":false},"marriage_down_curve":{"id":"marriage_down_curve","cat":"form","name":"婚姻线·末端下弯","label":"末端下弯","desc":"末端朝感情线方向弯下","read":"温柔体贴型：在关系里很会付出，也记得多照顾自己的感受。","q":null,"line_id":"marriage","health":false},"marriage_forked":{"id":"marriage_forked","cat":"form","name":"婚姻线·末端分叉","label":"末端分叉","desc":"尾端分成两股","read":"独立空间型：在亲密关系里也需要自己的空间，彼此尊重最舒服。","q":null,"line_id":"marriage","health":false},"marriage_to_sun":{"id":"marriage_to_sun","cat":"form","name":"婚姻线·延伸到无名指下","label":"延伸到无名指下","desc":"较长，伸到无名指下方甚至碰到太阳线","read":"良缘助力型：伴侣或重要关系会为你带来正能量和机会。","q":null,"line_id":"marriage","health":false},"health_none":{"id":"health_none","cat":"form","name":"健康线·没有健康线","label":"没有健康线","desc":"看不到从小指下斜穿手掌的线","read":"元气满满型：传统上认为没有这条线反而是好兆头。","q":{"text":"The hepatica (Plate XIII.) should lie straight down the hand — the straighter the better. It is an excellent sign to be without this line.","vern":"健康线如果有，越直越好；完全没有这条线，反而是好兆头。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part II, Ch. XIII The Line of Health, or the Hepatica (p.109)","url":"https://archive.org/details/cheiroslanguageo00hamo"},"line_id":"health","health":true},"health_straight":{"id":"health_straight","cat":"form","name":"健康线·有一条，比较直","label":"有一条，比较直","desc":"笔直、清楚、不碰生命线","read":"自律型：作息有规律，懂得照顾自己。","q":null,"line_id":"health","health":true},"health_broken":{"id":"health_broken","cat":"form","name":"健康线·有，但断断续续","label":"有，但断断续续","desc":"线条零碎","read":"提醒型：生活节奏偏快，适当留白、规律作息会让状态更好。","q":null,"line_id":"health","health":true},"girdle_venus_present":{"id":"girdle_venus_present","cat":"form","name":"金星环·有","label":"有","desc":"感情线上方有半圆弧（完整或断续）","read":"感受力强、审美好、富有艺术细胞，容易被美的事物打动。","q":{"text":"The Girdle of Venus (Plate XIII.) is that broken or unbroken kind of semicircle rising between the first and second fingers and finishing between the third and fourth.","vern":"金星环是一道（连续或断续的）半圆弧，从食指和中指之间起，到无名指和小指之间结束。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part II, Ch. XV The Girdle of Venus, the Ring of Saturn, and the Three Bracelets (p.112)","url":"https://archive.org/details/cheiroslanguageo00hamo"},"line_id":"girdle_venus","health":false},"girdle_venus_none":{"id":"girdle_venus_none","cat":"form","name":"金星环·没有","label":"没有","desc":"感情线上方没有弧线","read":"情绪稳定、务实踏实，不容易被外界情绪带跑。","q":null,"line_id":"girdle_venus","health":false},"bracelets_three_clear":{"id":"bracelets_three_clear","cat":"form","name":"手颈线·三条都清晰完整","label":"三条都清晰完整","desc":"手腕上有三道连贯的横纹","read":"福气绵长型：生活安稳、人缘好。","q":{"text":"有绕腕纹，周旋不断者，谓之玉钏纹，主人敬爱。一纹二纹者，主朝幕之荣。三纹仰上者，主翰苑之贵。","vern":"手腕上一圈圈不断的纹叫“玉钏纹”，主受人敬爱；一两道的有荣耀，三道向上弯的有文名。","src":"《神相全编》卷十（收于《钦定古今图书集成·博物汇编·艺术典》第640卷·相术部汇考十）·论手背纹","url":"https://zh.wikisource.org/wiki/欽定古今圖書集成/博物彙編/藝術典/第640卷"},"line_id":"bracelets","health":false},"bracelets_one_two":{"id":"bracelets_one_two","cat":"form","name":"手颈线·一到两条","label":"一到两条","desc":"手腕上只有一两道清晰的横纹","read":"踏实型：稳扎稳打，越过越好。","q":{"text":"有绕腕纹，周旋不断者，谓之玉钏纹，主人敬爱。一纹二纹者，主朝幕之荣。三纹仰上者，主翰苑之贵。","vern":"手腕上一圈圈不断的纹叫“玉钏纹”，主受人敬爱；一两道的有荣耀，三道向上弯的有文名。","src":"《神相全编》卷十（收于《钦定古今图书集成·博物汇编·艺术典》第640卷·相术部汇考十）·论手背纹","url":"https://zh.wikisource.org/wiki/欽定古今圖書集成/博物彙編/藝術典/第640卷"},"line_id":"bracelets","health":false},"bracelets_arched_first":{"id":"bracelets_arched_first","cat":"form","name":"手颈线·第一条向上拱起","label":"第一条向上拱起","desc":"最靠近手掌那条中间向手掌方向拱","read":"节奏提醒型：多注意劳逸结合。","q":null,"line_id":"bracelets","health":true},"mars_line_present":{"id":"mars_line_present","cat":"form","name":"火星线·有","label":"有","desc":"生命线内侧有平行副线","read":"双倍电池型：耐力强、抗压力强、恢复快。","q":{"text":"The line of Mars (Plate XIII.) is otherwise known as the inner vital or inner life line. It rises on the Mount of Mars, and sweeps down by the side of the line of life","vern":"火星线又叫“内生命线”，从火星丘起，沿着生命线内侧往下走。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part II, Ch. VI The Line of Mars (p.86)","url":"https://archive.org/details/cheiroslanguageo00hamo"},"line_id":"mars_line","health":false},"intuition_present":{"id":"intuition_present","cat":"form","name":"直觉线·有","label":"有","desc":"小指一侧有向掌心凸出的弧线","read":"第六感型：直觉准，善于察言观色、捕捉灵感。","q":{"text":"Its position on the hand is almost that of a semicircle from the face of the Mount of Mercury to that of the Mount of Luna.","vern":"直觉线的位置，大致是从水星丘到月丘的一道半圆弧。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part II, Ch. XIV The Via Lasciva and the Line of Intuition (p.111)","url":"https://archive.org/details/cheiroslanguageo00hamo"},"line_id":"intuition","health":false},"ring_saturn_present":{"id":"ring_saturn_present","cat":"form","name":"土星环·有","label":"有","desc":"中指根下有小弧环绕","read":"独立思考型：有主见，喜欢按自己的方式做事。","q":null,"line_id":"ring_saturn","health":false},"children_present":{"id":"children_present","cat":"form","name":"子女线·有细竖纹","label":"有细竖纹","desc":"婚姻线上方有细小竖纹","read":"亲和力强：很会照顾人，跟晚辈、小朋友处得来。","q":null,"line_id":"children","health":false},"five_metal":{"id":"five_metal","cat":"hand","name":"金形手","label":"手掌方中带圆、厚实，指节圆，掌色润","desc":"手掌圆厚、指节圆润、掌色有光泽，整体结实饱满。","read":"讲原则、有决断力，做事干脆利落，是值得信赖的人。","q":{"text":"金形掌圆厚，指节圆，掌色润","vern":"金形手：手掌圆厚，指节圆，掌色润泽。","src":"《神相铁关刀》（清·云谷山人）·卷二·五形五局","url":"https://zh.wikisource.org/wiki/神相鐵關刀"},"system":"中国五行手","health":false},"five_wood":{"id":"five_wood","cat":"hand","name":"木形手","label":"手掌偏瘦长，手指修长，纹路多","desc":"手掌瘦长、手指长、掌纹多而细。","read":"有书卷气，爱思考、重成长，适合学习、文化、教育类工作。","q":{"text":"木形掌瘦，指长纹多","vern":"木形手：手掌偏瘦，手指长，纹路多。","src":"《神相铁关刀》（清·云谷山人）·卷二·五形五局","url":"https://zh.wikisource.org/wiki/神相鐵關刀"},"system":"中国五行手","health":false},"five_water":{"id":"five_water","cat":"hand","name":"水形手","label":"掌肉丰满柔软，手指短圆，指节不明显","desc":"掌肉丰厚、软而滑，指节不显，手指短而圆。","read":"灵活圆融、亲和力强，善于沟通，人缘好、适应力强。","q":{"text":"水形掌肉浮胀，软滑节不露，微露筋，指短而圆","vern":"水形手：掌肉丰满，软滑，指节不显，手指短而圆。","src":"《神相铁关刀》（清·云谷山人）·卷二·五形五局","url":"https://zh.wikisource.org/wiki/神相鐵關刀"},"system":"中国五行手","health":false},"five_fire":{"id":"five_fire","cat":"hand","name":"火形手","label":"手掌偏瘦，指尖细，筋骨较明显","desc":"手掌瘦、指尖尖、筋骨显露，手指并拢时指缝较疏。","read":"热情有冲劲，反应快、行动力强，点子多，适合开创性工作。","q":{"text":"火形掌瘦，指尖露筋骨，掌疏","vern":"火形手：手掌偏瘦，指尖，筋骨显露，手指并拢时指缝较疏。","src":"《神相铁关刀》（清·云谷山人）·卷二·五形五局","url":"https://zh.wikisource.org/wiki/神相鐵關刀"},"system":"中国五行手","health":false},"five_earth":{"id":"five_earth","cat":"hand","name":"土形手","label":"手掌方而厚，手指短而方","desc":"手掌方正厚实，手指方而短。","read":"踏实稳重、守信用，做事一步一个脚印，是团队里的“定海神针”。","q":{"text":"土形掌方厚，指方短","vern":"土形手：手掌方而厚，手指方而短。","src":"《神相铁关刀》（清·云谷山人）·卷二·五形五局","url":"https://zh.wikisource.org/wiki/神相鐵關刀"},"system":"中国五行手","health":false},"west_earth":{"id":"west_earth","cat":"hand","name":"土型手","label":"方形手掌 + 短手指","desc":"手掌近似正方形，手指比手掌短，掌纹较少而深。","read":"务实可靠、动手能力强，喜欢看得见摸得着的成果。","q":null,"system":"西方四元素手","health":false},"west_air":{"id":"west_air","cat":"hand","name":"风型手","label":"方形手掌 + 长手指","desc":"手掌近似正方形，手指较长，掌纹清晰。","read":"聪明健谈、好奇心强，擅长沟通、写作和学习新东西。","q":null,"system":"西方四元素手","health":false},"west_fire":{"id":"west_fire","cat":"hand","name":"火型手","label":"长方形手掌 + 短手指","desc":"手掌明显长于宽，手指较短，掌纹多而有力。","read":"热情、自信、行动派，有感染力，敢想敢做。","q":null,"system":"西方四元素手","health":false},"west_water":{"id":"west_water","cat":"hand","name":"水型手","label":"长方形手掌 + 长手指","desc":"手掌长、手指也修长，掌纹细密。","read":"敏感细腻、富有想象力和同理心，艺术感强。","q":null,"system":"西方四元素手","health":false},"cheiro_elementary":{"id":"cheiro_elementary","cat":"hand","name":"原始型手（基础型）","label":"手掌宽厚、手指短、指甲短","desc":"手掌厚重宽大，手指和指甲都短。","read":"朴实直接、体力好，做事不绕弯子，脚踏实地。","q":null,"system":"Cheiro 七型手","health":false},"cheiro_square":{"id":"cheiro_square","cat":"hand","name":"方形手（实用型）","label":"手掌和指尖都偏方","desc":"手腕处方、指根处方、指尖也方。","read":"有条理、守时、讲规矩，执行力强。","q":{"text":"People with such a hand are orderly, punctual, and precise in manner","vern":"方形手的人有条理、守时、做事精确。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part I, Ch. III The Square Hand","url":"https://archive.org/details/cheiroslanguageo00hamo"},"system":"Cheiro 七型手","health":false},"cheiro_spatulate":{"id":"cheiro_spatulate","cat":"hand","name":"匙形手（行动型）","label":"指尖像小勺子一样展开","desc":"指尖宽而扁，像药剂师用的刮刀；手掌在腕部或指根处特别宽。","read":"行动派、爱发明、独立、有原创力。","q":{"text":"The spatulate hand (Part I., Chapter IV.) is the hand of action, invention, independence, and originality.","vern":"匙形手是行动、发明、独立和原创的手。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part II, Ch. VIII The Line of Head in Relation to the Seven Types","url":"https://archive.org/details/cheiroslanguageo00hamo"},"system":"Cheiro 七型手","health":false},"cheiro_philosophic":{"id":"cheiro_philosophic","cat":"hand","name":"哲学手（思考型）","label":"手长、骨感，指节明显","desc":"手形修长有棱角，手指骨感、关节突出，指甲长。","read":"爱思考、追求智慧，常有独到见解。","q":{"text":"The philosophic hand (Part I., Chapter V.) is thoughtful, earnest in the pursuit of wisdom","vern":"哲学手爱思考，认真追求智慧。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part II, Ch. VIII The Line of Head in Relation to the Seven Types","url":"https://archive.org/details/cheiroslanguageo00hamo"},"system":"Cheiro 七型手","health":false},"cheiro_conic":{"id":"cheiro_conic","cat":"hand","name":"圆锥形手（艺术型）","label":"手掌略收窄，指尖微尖","desc":"中等大小，手掌微微收窄，指根饱满、指尖呈圆锥形。","read":"凭直觉和灵感行事，有艺术气质，热爱美好事物。","q":{"text":"The main characteristics of the conic hand are impulse and instinct.","vern":"圆锥形手的主要特点是凭冲动和直觉行事。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part I, Ch. VI The Conic Hand","url":"https://archive.org/details/cheiroslanguageo00hamo"},"system":"Cheiro 七型手","health":false},"cheiro_psychic":{"id":"cheiro_psychic","cat":"hand","name":"灵性手（理想型）","label":"手又长又窄，手指细长而尖","desc":"手形狭长，手指很长且尖细，十分少见。","read":"理想主义，感受力和想象力极强，富有灵性。","q":{"text":"The name explains itself — that which appertains to the soul.","vern":"名字本身就说明了一切：属于心灵的手。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part I, Ch. VII The Psychic Hand","url":"https://archive.org/details/cheiroslanguageo00hamo"},"system":"Cheiro 七型手","health":false},"cheiro_mixed":{"id":"cheiro_mixed","cat":"hand","name":"混合型手","label":"几种特征都有一点","desc":"手指形状各不相同，难以归入单一类型。","read":"多才多艺、适应力强，什么都能聊，什么都能上手。","q":{"text":"The mixed hand is the most difficult of all to describe.","vern":"混合型手是所有手型里最难描述的。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part I, Ch. VIII The Mixed Hand","url":"https://archive.org/details/cheiroslanguageo00hamo"},"system":"Cheiro 七型手","health":false},"simian":{"id":"simian","cat":"mark","name":"断掌（通贯掌）","label":"智慧线和感情线合成一条横贯手掌的线","desc":"智慧线与感情线合为一条，从拇指侧一直横穿到小指侧（西方称 Simian line）。","read":"专注力超强型：认定的事情会全力以赴，意志坚定、执行力强，理性和感性高度统一。","q":null,"typical_location":"横贯掌心","health":false},"chuan":{"id":"chuan","cat":"mark","name":"川字纹","label":"三大主线都很清晰，像个“川”字","desc":"生命线、智慧线、感情线都清楚深刻，互不相连，形似“川”字（现代民间说法）。","read":"实干家型：做事有魄力，目标清晰，能把想法落地。","q":{"text":"五指俱生川字纹。","vern":"五个手指都长有“川”字纹。","src":"《神相全编》卷十（收于《钦定古今图书集成·博物汇编·艺术典》第640卷·相术部汇考十）·玉掌图·川字纹","url":"https://zh.wikisource.org/wiki/欽定古今圖書集成/博物彙編/藝術典/第640卷"},"typical_location":"掌心","health":false},"cross":{"id":"cross","cat":"mark","name":"十字纹","label":"掌中有清楚的“十”字","desc":"两条短线交叉成十字。","read":"贵人缘型：常有意外好运和贵人帮忙；长在食指下，代表会遇到一段重要的感情。","q":{"text":"有印纹者贵，有田纹者富，有井纹者福，有十纹者禄。","vern":"有印形纹主贵气，田字纹主富足，井字纹主福气，十字纹主有俸禄（收入稳定）。","src":"《神相全编》卷十（收于《钦定古今图书集成·博物汇编·艺术典》第640卷·相术部汇考十）·论掌纹","url":"https://zh.wikisource.org/wiki/欽定古今圖書集成/博物彙編/藝術典/第640卷"},"typical_location":"不定（常见于掌心、坤宫、木星丘）","health":false},"mystic_cross":{"id":"mystic_cross","cat":"mark","name":"神秘十字","label":"智慧线与感情线之间有十字","desc":"在两条大横线之间的独立十字，西方称 La Croix Mystique。","read":"玄学体质型：对神秘学、心理学、哲学有兴趣，直觉敏锐。","q":null,"typical_location":"掌心上部（智慧线与感情线之间）","health":false},"star":{"id":"star","cat":"mark","name":"星纹","label":"有像“米”字或星星的小纹","desc":"三四条短线交叉成星形。","read":"高光时刻型：象征某方面会有突出的成就或惊喜，长在哪座丘上，就在那方面发光。","q":{"text":"I consider it, with one or two exceptions, a fortunate sign, and one which naturally should depend upon the portion of the hand, or the line, with which it is connected.","vern":"星纹除了极少数情况，基本是幸运的记号，具体看它长在哪个部位、连着哪条线。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part II, Ch. XVIII The Star (p.121)","url":"https://archive.org/details/cheiroslanguageo00hamo"},"typical_location":"不定（常见于手指下的丘上）","health":false},"triangle":{"id":"triangle","cat":"mark","name":"三角纹","label":"有清楚的三角形","desc":"三条短线围成的独立三角形。","read":"智慧领导型：头脑清楚、有组织能力；长在食指下，特别擅长带团队。","q":{"text":"When distinct in shape on the Mount of Jupiter, it promises more than usual success in the management of people","vern":"三角纹清楚地长在木星丘（食指根下）时，表示特别擅长带人、管理。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part II, Ch. XXII The Grille, the Triangle... (p.131)","url":"https://archive.org/details/cheiroslanguageo00hamo"},"typical_location":"不定（常见于食指下、掌心）","health":false},"square":{"id":"square","cat":"mark","name":"方形纹（保护纹）","label":"有小方框/四方形","desc":"四条短线围成的小方框。","read":"保护符型：遇到难关时总能逢凶化吉，有贵人或运气托底。","q":{"text":"It is usually called \"the mark of preservation,\" because it shows that the subject is protected at that particular point from whatever danger menaced.","vern":"方形纹常被叫作“保护纹”，表示在那个阶段有保护、能化险为夷。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part II, Ch. XX The Square (p.127)","url":"https://archive.org/details/cheiroslanguageo00hamo"},"typical_location":"不定（常压在断开的主线上）","health":false},"well":{"id":"well","cat":"mark","name":"井字纹","label":"有“井”字形的纹","desc":"两横两竖交叉成“井”字。","read":"福气型：古书认为井字纹是福纹，长在掌中尤其吉利，象征聚福、聚财。","q":{"text":"有印纹者贵，有田纹者富，有井纹者福，有十纹者禄。","vern":"有印形纹主贵气，田字纹主富足，井字纹主福气，十字纹主有俸禄（收入稳定）。","src":"《神相全编》卷十（收于《钦定古今图书集成·博物汇编·艺术典》第640卷·相术部汇考十）·论掌纹","url":"https://zh.wikisource.org/wiki/欽定古今圖書集成/博物彙編/藝術典/第640卷"},"typical_location":"不定（常见于掌心、坎宫、巽宫）","health":false},"island":{"id":"island","cat":"mark","name":"岛纹","label":"线上有个小椭圆圈","desc":"线条上的小椭圆形分叉再合拢，像一座小岛；古书称“眼纹”。","read":"充电提醒型：所在那条线代表的方面，某段时间适合放慢节奏、稳中求进；长在大拇指上古称“夫子眼”，主聪明。","q":{"text":"The island is not a fortunate sign, but it only relates to the line or portion of the hand on which it is found.","vern":"岛纹不算吉纹，但它只影响所在的那条线或那个部位。","src":"Cheiro, Cheiro's Language of the Hand (Rand, McNally 1900 ed.; ©1897), Part II, Ch. XXI The Island, the Circle, the Spot (p.129)","url":"https://archive.org/details/cheiroslanguageo00hamo"},"typical_location":"长在某条线上","health":false},"grille":{"id":"grille","cat":"mark","name":"格子纹","label":"有许多交叉的细格子","desc":"多条细线纵横交错成网格。","read":"活跃脑袋型：想法多、精力旺，适合同时推进几件事；也记得给自己减压。","q":{"text":"掌平心亦平，纹正心亦正，纹横则性横；纹浅机亦浅，纹深机亦深。纹多心绪多，纹少机关少；","vern":"掌心平，心也平和；纹正，人也正直。纹浅的人想法直接，纹深的人心思深；纹多的人心事多，纹少的人简单爽快。","src":"《神相全编》卷十（收于《钦定古今图书集成·博物汇编·艺术典》第640卷·相术部汇考十）·相心性","url":"https://zh.wikisource.org/wiki/欽定古今圖書集成/博物彙編/藝術典/第640卷"},"typical_location":"不定（多在丘上）","health":false},"fish":{"id":"fish","cat":"mark","name":"鱼纹","label":"有像小鱼一样的纹","desc":"一个尖头小环加分叉的尾巴，形似小鱼。","read":"福禄双全型：古书说主兄弟和睦、鱼尾通到手指的主富，象征财运与好人缘。","q":{"text":"此纹似生鱼。平生手足兄弟和美。若鱼尾贯指须富。","vern":"这种纹像一条鱼，一生兄弟和睦；鱼尾通到手指的，主富。","src":"《神相全编》卷十（收于《钦定古今图书集成·博物汇编·艺术典》第640卷·相术部汇考十）·相掌善恶","url":"https://zh.wikisource.org/wiki/欽定古今圖書集成/博物彙編/藝術典/第640卷"},"typical_location":"不定（常见于手腕上方、掌根）","health":false},"ring_solomon":{"id":"ring_solomon","cat":"mark","name":"所罗门环","label":"食指根下有一道小弧环","desc":"环绕食指根部的小弧线（Ring of Solomon）。","read":"智者型：有洞察力，善于理解人心，适合做顾问、老师、咨询类工作。","q":null,"typical_location":"木星丘（食指根下）","health":false},"mole_palm":{"id":"mole_palm","cat":"mark","name":"掌中痣","label":"手掌心有颗痣","desc":"手掌内有痣或小黑点（注意与色素沉着区分）。","read":"握财型：古书说掌中有痣聪明又有财运，吃穿不愁。","q":{"text":"黑子掌中，财食无穷。","vern":"掌中有痣，吃穿用度不愁。","src":"《许负相法·相手篇第十一》·相手篇第十一","url":"https://zh.wikisource.org/wiki/許負相法/相手篇第十一"},"typical_location":"掌心","health":true},"many_lines":{"id":"many_lines","cat":"mark","name":"掌纹细密","label":"掌纹很多很细","desc":"除了几条主线外，满手都是细小纹路。","read":"心思细腻型：感受丰富、观察力强、点子多。","q":{"text":"纹细如乱丝者，聪明美貌；","vern":"纹路细密像丝线的人，古书说聪明、相貌好。","src":"《神相全编》卷十（收于《钦定古今图书集成·博物汇编·艺术典》第640卷·相术部汇考十）·论掌纹","url":"https://zh.wikisource.org/wiki/欽定古今圖書集成/博物彙編/藝術典/第640卷"},"typical_location":"整个手掌","health":false},"few_lines":{"id":"few_lines","cat":"mark","name":"掌纹简洁","label":"只有几条主线，非常干净","desc":"掌纹少、线条清楚简洁。","read":"简单纯粹型：心思单纯、目标明确，烦恼少、执行快。","q":{"text":"掌平心亦平，纹正心亦正，纹横则性横；纹浅机亦浅，纹深机亦深。纹多心绪多，纹少机关少；","vern":"掌心平，心也平和；纹正，人也正直。纹浅的人想法直接，纹深的人心思深；纹多的人心事多，纹少的人简单爽快。","src":"《神相全编》卷十（收于《钦定古今图书集成·博物汇编·艺术典》第640卷·相术部汇考十）·相心性","url":"https://zh.wikisource.org/wiki/欽定古今圖書集成/博物彙編/藝術典/第640卷"},"typical_location":"整个手掌","health":false},"bagua_xun":{"id":"bagua_xun","cat":"mount","name":"巽宫","label":"巽宫（食指根下方）","desc":"掌上东南方，五行属木。","read":"巽宫饱满：财运旺，年轻时就有不错的机会，赚钱有门道。","q":{"text":"巽：为财帛、为禄马，居辰巳，属木。","vern":"巽宫代表财帛和禄马（收入、奔走发展），方位辰巳，五行属木。","src":"《神相全编》卷十（收于《钦定古今图书集成·博物汇编·艺术典》第640卷·相术部汇考十）·根基所属","url":"https://zh.wikisource.org/wiki/欽定古今圖書集成/博物彙編/藝術典/第640卷"},"system":"八卦宫","reading_if_flat":"巽宫平坦：财务风格稳健，靠积累慢慢变富。","governs":"财帛、禄马（收入与发展机会）","region":"食指根下方","cx":0.82,"cy":0.12,"health":false},"bagua_li":{"id":"bagua_li","cat":"mount","name":"离宫","label":"离宫（中指与无名指根下方）","desc":"掌上正南方，五行属火。","read":"离宫饱满：中年事业显达，容易被看见、被认可。","q":{"text":"离为龙虎为官禄，居午属火。","vern":"离宫代表官禄（事业、名声），方位午，五行属火。","src":"《神相全编》卷十（收于《钦定古今图书集成·博物汇编·艺术典》第640卷·相术部汇考十）·根基所属","url":"https://zh.wikisource.org/wiki/欽定古今圖書集成/博物彙編/藝術典/第640卷"},"system":"八卦宫","reading_if_flat":"离宫平坦：更在乎做事本身，不太追求虚名。","governs":"官禄、功名（事业与名声）","region":"中指与无名指根下方","cx":0.48,"cy":0.1,"health":false},"bagua_kun":{"id":"bagua_kun","cat":"mount","name":"坤宫","label":"坤宫（小指根下方）","desc":"掌上西南方，五行属土。","read":"坤宫饱满：福气好，越老越有福，家庭和睦。","q":{"text":"坤为福德、为父母，居未申，属土。","vern":"坤宫代表福德和父母，方位未申，五行属土。","src":"《神相全编》卷十（收于《钦定古今图书集成·博物汇编·艺术典》第640卷·相术部汇考十）·根基所属","url":"https://zh.wikisource.org/wiki/欽定古今圖書集成/博物彙編/藝術典/第640卷"},"system":"八卦宫","reading_if_flat":"坤宫平坦：独立自主，自己的福气自己创造。","governs":"福德、父母（《铁关刀》称主子嗣）","region":"小指根下方","cx":0.14,"cy":0.12,"health":false},"bagua_dui":{"id":"bagua_dui","cat":"mount","name":"兑宫","label":"兑宫（小指一侧掌缘中部）","desc":"掌上正西方，五行属金。","read":"兑宫饱满：人缘好，身边有得力帮手，晚辈缘佳。","q":{"text":"为奴仆、为子息，居酉属金。","vern":"兑宫代表部属（帮手）和子女，方位酉，五行属金。","src":"《神相全编》卷十（收于《钦定古今图书集成·博物汇编·艺术典》第640卷·相术部汇考十）·根基所属","url":"https://zh.wikisource.org/wiki/欽定古今圖書集成/博物彙編/藝術典/第640卷"},"system":"八卦宫","reading_if_flat":"兑宫平坦：习惯靠自己，凡事亲力亲为。","governs":"部属、子女（现代改称：朋友、团队与晚辈）","region":"小指一侧掌缘中部","cx":0.08,"cy":0.42,"health":false},"bagua_qian":{"id":"bagua_qian","cat":"mount","name":"乾宫","label":"乾宫（掌根小指一侧）","desc":"掌上西北方，五行属金。","read":"乾宫饱满：长辈缘好，得家里支持，也重视家族传承。","q":{"text":"干为天门、为父，居戌亥，属金。","vern":"乾宫叫“天门”，代表父亲（长辈），方位戌亥，五行属金。","src":"《神相全编》卷十（收于《钦定古今图书集成·博物汇编·艺术典》第640卷·相术部汇考十）·根基所属","url":"https://zh.wikisource.org/wiki/欽定古今圖書集成/博物彙編/藝術典/第640卷"},"system":"八卦宫","reading_if_flat":"乾宫平坦：独立成长型，自己闯出一片天。","governs":"天门、父亲（长辈）","region":"掌根小指一侧","cx":0.12,"cy":0.85,"health":false},"bagua_kan":{"id":"bagua_kan","cat":"mount","name":"坎宫","label":"坎宫（手腕上方掌根正中）","desc":"掌上正北方，五行属水。","read":"坎宫饱满：根基稳，家底厚，做事有底气。","q":{"text":"坎为海门，为根基，居子丑，属水。","vern":"坎宫叫“海门”，代表根基，方位子丑，五行属水。","src":"《神相全编》卷十（收于《钦定古今图书集成·博物汇编·艺术典》第640卷·相术部汇考十）·根基所属","url":"https://zh.wikisource.org/wiki/欽定古今圖書集成/博物彙編/藝術典/第640卷"},"system":"八卦宫","reading_if_flat":"坎宫平坦：白手起家型，靠自己打下根基。","governs":"海门、根基（家底与根基）","region":"手腕上方掌根正中","cx":0.45,"cy":0.9,"health":false},"bagua_gen":{"id":"bagua_gen","cat":"mount","name":"艮宫","label":"艮宫（大拇指根下部、靠近手腕）","desc":"掌上东北方，五行属土。","read":"艮宫饱满：有置业运，家宅安稳。","q":{"text":"为田宅、为坟墓居丑，寅属土。","vern":"艮宫代表田宅（家宅、房产）和祖坟，方位丑寅，五行属土。","src":"《神相全编》卷十（收于《钦定古今图书集成·博物汇编·艺术典》第640卷·相术部汇考十）·根基所属","url":"https://zh.wikisource.org/wiki/欽定古今圖書集成/博物彙編/藝術典/第640卷"},"system":"八卦宫","reading_if_flat":"艮宫平坦：喜欢自由，不被房子绑住。","governs":"田宅（家宅、房产）","region":"大拇指根下部、 function sel(q){const a=st.ans[q.id];return Array.isArray(a)?a:[];}
function renderQuiz(){
  const q=cur(),chosen=sel(q),multi=q.sel==='multiple';
  const saved=loadLast();
  let h=saved&&!st.started?`<div class="lastbar"><span>上次手相结果（${new Date(saved.t).toLocaleDateString('zh-CN')}，${saved.hand==='L'?'左手':'右手'}）</span><button id="sxShowLast">查看</button></div>`:'';
  h+=`<div class="prog"><i style="width:${(st.i/QS.length*100).toFixed(1)}%"></i></div><span class="qstep">${E(q.step)} · 第 ${st.i+1}/${QS.length} 题</span><div class="qtext">${E(q.q)}${multi?'':''}</div><div class="opts">`;
  q.ids.forEach(id=>{const o=P.opts[id];h+=`<button class="opt ${chosen.includes(id)?'on':''}" data-id="${id}"><b>${E(o.label||o.name)}</b><span>${E(o.cat==='form'?o.desc:(o.cat==='mount'?(o.governs?'主'+o.governs:o.desc):o.desc))}</span></button>`;});
  h+=`<button class="opt ${st.ans[q.id]==='skip'?'on':''}" data-id="__skip"><b>${multi?'都没有 / 不确定':'不确定 / 跳过'}</b></button></div>`;
  h+=`<div class="qnav"><button id="sxPrev" ${st.i===0?'disabled':''}>上一题</button><button class="primary" id="sxNext">${st.i===QS.length-1?'看结果':(st.ans[q.id]?'下一题':'跳过')}</button></div>`;
  $$('sxQuiz').innerHTML=h;
  if($$('sxShowLast'))$$('sxShowLast').onclick=()=>{st={...st,hand:saved.hand,ans:saved.ans,done:true,t:saved.t};syncHand();showResult();};
  $$('sxQuiz').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.started=true;const id=b.dataset.id;
    if(id==='__skip'){st.ans[q.id]='skip';renderQuiz();return;}
    let a=sel(q).slice();
    if(multi){a=a.includes(id)?a.filter(x=>x!==id):a.concat(id);}else{a=a.includes(id)?[]:[id];}
    st.ans[q.id]=a.length?a:undefined;renderQuiz();
    if(!multi&&a.length)setTimeout(()=>{if(cur()===q&&st.i<QS.length-1){st.i++;renderQuiz();}},350);});
  $$('sxPrev').onclick=()=>{if(st.i>0){st.i--;renderQuiz();}};
  $$('sxNext').onclick=()=>{st.started=true;if(!st.ans[q.id])st.ans[q.id]='skip';if(st.i<QS.length-1){st.i++;renderQuiz();}else finish();};
  // diagram for this question
  const mounts=q.table==='palm_mounts'?q.ids.map(id=>({...P.opts[id],on:chosen.includes(id)})):[];
  svgDraw({line:q.line,mounts});
  const l=LINE[q.line];
  $$('svgCap').innerHTML=l?`红线：<b>${E(l.name)}</b>（${E(l.start)} → ${E(l.end)}）`:(mounts.length?'金点是各宫 / 丘的位置，选中的会变红':(q.table==='hand_types'?'看整只手的形状、手指长短':'对照掌心找找这些纹'));
}
function finish(){st.done=true;st.t=Date.now();localStorage.setItem(LKEY,JSON.stringify({t:st.t,hand:st.hand,ans:st.ans}));showResult(true);}
function loadLast(){try{return JSON.parse(localStorage.getItem(LKEY))}catch(e){return null}}
function quoteHTML(q){if(!q)return '';return `<div class="quote"><div class="qt">「${E(q.text)}」</div>${q.vern?`<div class="qv">白话：${E(q.vern)}</div>`:''}<div class="qs">—— ${q.url?`<a href="${E(q.url)}" target="_blank" rel="noopener">${E(q.src)}</a>`:E(q.src)}</div></div>`;}
const DOC='<div class="doc">⚕️ 这里不作任何健康判断，身体有不舒服请看医生。</div>';
function itemHTML(q,o){
  let title=E(o.name),sub='';
  if(o.cat==='form'){const l=LINE[o.line_id];title=E(l?l.name:o.name);sub=E(o.label);}
  else if(o.cat==='hand'){sub=E(o.system||'');}
  else if(o.cat==='mount'){sub=E((o.system||'')+(o.governs?' · 主'+o.governs:''));}
  else if(o.cat==='mark'){sub=E(o.typical_location||'');}
  let qt=o.q;if(!qt&&o.cat==='form'&&LINE[o.line_id])qt=LINE[o.line_id].q;
  const health=o.health||(o.cat==='form'&&LINE[o.line_id]&&LINE[o.line_id].health);
  return `<div class="item"><div class="t">${title}<small>${sub}</small></div><div class="r">${E(o.read)}</div>${quoteHTML(qt)}${health?DOC:''}</div>`;}
function showResult(scroll){
  const QM=Object.fromEntries(QS.map(q=>[q.id,q]));let n=0;
  let h=`<div class="card"><h2>你的手相解读</h2><p class="hint">${st.hand==='L'?'左手':'右手'} · ${new Date(st.t||Date.now()).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}。下面是按你选的特征整理的传统说法，都往好的方面讲。</p></div>`;
  GROUPS.forEach(([g,ids])=>{let body='';ids.forEach(id=>{const q=QM[id];if(!q)return;sel(q).forEach(oid=>{body+=itemHTML(q,P.opts[oid]);n++;});});
    h+=`<div class="card sxgroup"><h3>${g}</h3>${body||'<p class="hint">这部分你跳过了。</p>'}</div>`;});
  h+=`<div class="card"><p class="hint">引文是古籍或 Cheiro 原书的原话，反映的是古人的观念，只当作传统文化来欣赏。</p><button class="btn ghost" id="sxAgain">重新看一次</button><button class="btn ghost" id="sxEdit" style="margin-top:8px">回去改答案</button></div>`;
  $$('sxResult').innerHTML=h;$$('sxQuiz').classList.add('hidden');
  svgDraw({labels:true});$$('svgCap').textContent='三大主线和其他主要纹路的位置示意';
  $$('sxAgain').onclick=()=>{st={hand:st.hand,i:0,ans:{},done:false,started:true};$$('sxResult').innerHTML='';$$('sxQuiz').classList.remove('hidden');renderQuiz();$$('tab-shouxiang').scrollIntoView({behavior:'smooth'});};
  $$('sxEdit').onclick=()=>{st.done=false;st.started=true;st.i=0;$$('sxResult').innerHTML='';$$('sxQuiz').classList.remove('hidden');renderQuiz();$$('sxQuiz').scrollIntoView({behavior:'smooth'});};
  if(scroll)$$('sxResult').scrollIntoView({behavior:'smooth'});}
function syncHand(){document.querySelectorAll('#handSeg button').forEach(b=>b.classList.toggle('on',b.dataset.h===st.hand));}
document.querySelectorAll('#handSeg button').forEach(b=>b.onclick=()=>{st.hand=b.dataset.h;syncHand();if(st.done)svgDraw({labels:true});else renderQuiz();});
// photo: local only (object URL), never uploaded or stored
let url=null;
$$('palmFile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);
  const im=$$('palmImg');im.src=url;im.classList.remove('hidden');$$('photoBox').classList.add('has');$$('photoClear').classList.remove('hidden');e.target.value='';};
$$('photoClear').onclick=()=>{if(url)URL.revokeObjectURL(url);url=null;const im=$$('palmImg');im.removeAttribute('src');im.classList.add('hidden');$$('photoBox').classList.remove('has');$$('photoClear').classList.add('hidden');};
$$('sxDisc').innerHTML='⚠️ '+E(P.disclaimer);
renderQuiz();
window.__palm={st:()=>st,showResult,svgDraw};
})();

</script>
</body>
</html>
