<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1410">
<title>迫子算卦 · 周易六爻</title>
<style>
:root{--bg:#1b1410;--card:#f6efe1;--ink:#2a1f17;--muted:#7a6a58;--gold:#c9a24a;--red:#a8322a;--line:#2a1f17;--soft:#ebe0c9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(ellipse at top,#3a2a1e 0%,#1b1410 60%) fixed;color:var(--ink);font-family:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 30px}
header{text-align:center;padding:22px 0 8px;color:var(--gold)}
header h1{margin:0;font-size:30px;letter-spacing:6px;font-weight:700}
header p{margin:4px 0 0;color:#b9a789;font-size:13px;letter-spacing:2px}
nav.tabs{display:flex;gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(201,162,74,.35);border-radius:14px;padding:5px;margin:12px 0 16px;position:sticky;top:6px;z-index:5;backdrop-filter:blur(6px)}
nav.tabs button{flex:1;border:0;background:transparent;color:#d9c9a8;font:inherit;font-size:16px;padding:10px 0;border-radius:10px;letter-spacing:2px}
nav.tabs button.on{background:var(--gold);color:#1b1410;font-weight:700}
.card{background:var(--card);border-radius:16px;padding:18px 16px;margin-bottom:14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.card h2{margin:0 0 10px;font-size:19px;color:var(--red);letter-spacing:2px}
.card h3{margin:14px 0 6px;font-size:16px;color:var(--ink)}
textarea{width:100%;border:1px solid #d6c7a6;background:#fffaf0;border-radius:10px;padding:10px;font:inherit;font-size:16px;resize:none;color:var(--ink)}
.hint{color:var(--muted);font-size:13px;line-height:1.6}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:inherit;font-size:20px;letter-spacing:6px;background:linear-gradient(180deg,#b8392f,#8c241d);color:#fff4dc;box-shadow:0 4px 0 #5e140f;margin-top:12px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #5e140f}
.btn[disabled]{opacity:.55}
.btn.ghost{background:transparent;color:var(--red);border:1px solid var(--red);box-shadow:none;font-size:16px;letter-spacing:3px;padding:11px}
.coins{display:flex;justify-content:center;gap:16px;margin:16px 0 6px;perspective:600px}
.coin{width:64px;height:64px;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.4,.5,1)}
.coin .f{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#f3d98a,#c9a24a 55%,#8a6a22);border:3px solid #7a5a1a;box-shadow:inset 0 0 0 4px rgba(255,240,190,.35)}
.coin .f::after{content:"";width:16px;height:16px;background:var(--card);border:2px solid #7a5a1a;position:absolute}
.coin .f span{position:absolute;font-size:13px;font-weight:700;color:#5a3f0e}
.coin .f span:nth-child(1){top:5px}.coin .f span:nth-child(2){bottom:5px}.coin .f span:nth-child(3){left:7px}.coin .f span:nth-child(4){right:7px}
.coin .back{transform:rotateY(180deg);background:radial-gradient(circle at 35% 30%,#e8c870,#b08a35 55%,#6f5218)}
.coin .back::before{content:"";position:absolute;inset:9px;border-radius:50%;border:2px dashed rgba(90,63,14,.55)}
.coin.spin{animation:spin .9s ease-out}
@keyframes spin{0%{transform:translateY(0) rotateY(0)}40%{transform:translateY(-46px) rotateY(900deg)}100%{transform:translateY(0) rotateY(1440deg)}}
.tosslog{text-align:center;font-size:14px;color:var(--muted);min-height:20px}
.build{display:flex;flex-direction:column-reverse;gap:7px;align-items:center;margin:14px 0 4px;min-height:120px}
.yao{display:flex;align-items:center;gap:10px}
.bar{width:150px;height:14px;display:flex;justify-content:space-between}
.bar i{display:block;background:var(--line);height:100%;border-radius:2px}
.bar.yang i{width:100%}
.bar.yin i{width:44%}
.bar.chg i{background:var(--red)}
.yao .lab{width:62px;font-size:12px;color:var(--muted)}
.yao .mk{width:22px;color:var(--red);font-weight:700;text-align:center}
.yao.new{animation:fadein .5s}
@keyframes fadein{from{opacity:0;transform:scale(.8)}to{opacity:1}}
.hexrow{display:flex;gap:10px;align-items:stretch}
.hexbox{flex:1;background:#fffaf0;border:1px solid #e0d2b2;border-radius:12px;padding:12px 8px;text-align:center}
.hexbox .tag{font-size:12px;color:#fff;background:var(--red);display:inline-block;padding:1px 8px;border-radius:8px}
.hexbox .tag.b{background:#6b5a3e}
.hexbox .nm{font-size:24px;font-weight:700;margin:6px 0 2px;letter-spacing:2px}
.hexbox .sub{font-size:12px;color:var(--muted)}
.mini{display:flex;flex-direction:column-reverse;gap:5px;align-items:center;margin:10px 0}
.mini .bar{width:84px;height:9px}
.arrow{align-self:center;color:var(--gold);font-size:22px}
.rule{background:#fff3d6;border-left:4px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.7;margin:12px 0}
.rule b{color:var(--red)}
.read{background:#fffaf0;border:1px solid #e6d6b4;border-radius:10px;padding:10px 12px;margin:8px 0;line-height:1.8}
.read .w{font-size:12px;color:var(--muted)}
.read.main{border:2px solid var(--red);background:#fff6ec}
.read .t{font-size:17px}
.read .x{font-size:13px;color:var(--muted)}
.txt{line-height:1.85;font-size:15px}
.txt .k{color:var(--red);font-weight:700;margin-right:4px}
.yl{padding:6px 0;border-bottom:1px dashed #dccbaa;font-size:15px;line-height:1.75}
.yl.hl{background:#fde7df;margin:0 -8px;padding:6px 8px;border-radius:6px}
.yl .x{display:block;font-size:13px;color:var(--muted)}
.bh .row{display:flex;gap:8px;padding:6px 0;line-height:1.6;font-size:15px}
.bh .row b{flex:0 0 46px;color:var(--red)}
details{margin-top:8px}
summary{cursor:pointer;color:var(--red);font-size:15px;padding:6px 0}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:10px 4px;border-bottom:1px solid #e3d5b6;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.hist li .q{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.hist li button{border:0;background:none;color:var(--red);font:inherit;font-size:14px}
.qshow{font-size:14px;color:var(--muted);margin-bottom:8px}
.soon{text-align:center;padding:40px 16px}
.soon .big{font-size:56px}
.soon h2{color:var(--red)}
.plan{text-align:left;font-size:14px;color:var(--muted);line-height:1.8;margin-top:12px}
footer{text-align:center;color:#8f7d62;font-size:12px;padding:10px 0 20px;letter-spacing:1px}
.seg{display:flex;background:#eadfc6;border-radius:10px;padding:4px;margin:10px 0}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:16px;padding:8px;border-radius:8px;color:var(--ink)}
.seg button.on{background:var(--red);color:#fff4dc}
.palmgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:520px){.palmgrid{grid-template-columns:1fr 1fr}#palmImg{max-height:420px}}
.photoBox{position:relative;background:#fffaf0;border:1px dashed #cdb98f;border-radius:12px;min-height:120px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photoBox.has{border-style:solid;min-height:0}
.photoPick{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--red);font-size:16px;width:100%;min-height:120px;cursor:pointer}
.photoBox.has .photoPick{display:none}
.photoPick input{display:none}
.photoPick small{color:var(--muted);font-size:12px}
#palmImg{width:100%;max-height:230px;object-fit:contain;display:block}
#palmImg.hidden{display:none}
.mini-btn{position:absolute;right:8px;top:8px;border:0;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font:inherit;font-size:12px;padding:5px 9px}
.svgBox{background:#fffaf0;border:1px solid #e0d2b2;border-radius:12px;padding:6px}
#palmSvg{width:100%;height:auto;display:block}
.svgcap{text-align:center;font-size:13px;color:var(--muted);min-height:18px;padding:2px 4px 4px}
.prog{height:6px;background:#eadfc6;border-radius:4px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--red);transition:width .3s}
.qstep{font-size:12px;color:#fff;background:#6b5a3e;display:inline-block;padding:1px 8px;border-radius:8px;margin-bottom:6px}
.qtext{font-size:18px;font-weight:700;margin:4px 0 10px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid #dccbaa;background:#fffaf0;border-radius:10px;padding:10px 12px;font:inherit;color:var(--ink)}
.opt b{display:block;font-size:16px}
.opt span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.opt.on{border:2px solid var(--red);background:#fde7df}
.qnav{display:flex;gap:8px;margin-top:12px}
.qnav button{flex:1;border-radius:10px;padding:11px;font:inherit;font-size:15px;border:1px solid var(--red);background:transparent;color:var(--red)}
.qnav button.primary{background:var(--red);color:#fff4dc}
.qnav button[disabled]{opacity:.4}
.sxgroup h3{color:var(--red);margin:4px 0 8px;font-size:17px}
.item{border-top:1px dashed #dccbaa;padding:10px 0}
.item:first-of-type{border-top:0}
.item .t{font-weight:700;font-size:15.5px}
.item .t small{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
.item .r{line-height:1.75;font-size:15px;margin-top:3px}
.quote{background:#f3ead6;border-left:3px solid var(--gold);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:13.5px;line-height:1.7}
.quote .qt{color:#4a3a2a}
.quote .qv{color:var(--muted);margin-top:3px}
.quote .qs{font-size:12px;color:#8f7d62;margin-top:3px}
.quote .qs a{color:#8f7d62}
.doc{margin-top:6px;font-size:13px;color:#8c241d;background:#fff0ea;border-radius:6px;padding:5px 8px}
.disclaimer{font-size:13px;color:var(--muted);line-height:1.7;background:#efe5cf}
.lastbar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff3d6;border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:14px}
.lastbar button{border:0;background:var(--red);color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<header><h1>迫子算卦</h1><p>周易 · 六爻 · 金钱课</p></header>
<nav class="tabs" id="tabs">
  <button data-tab="liuyao" class="on">六爻占卜</button>
  <button data-tab="shouxiang">手相</button>
</nav>

<section id="tab-liuyao">
  <div class="card" id="askCard">
    <h2>心诚则灵</h2>
    <textarea id="q" rows="2" maxlength="120" placeholder="心中默念所问之事（可不填），例如：这次换工作顺利吗？"></textarea>
    <p class="hint">静心片刻，想着你的问题，点「摇卦」六次。每次掷三枚铜钱（字面为三、背面为二，合计六老阴、七少阳、八少阴、九老阳），从下往上依次成爻。</p>
    <div class="coins" id="coins"></div>
    <div class="tosslog" id="tosslog">尚未起卦</div>
    <div class="build" id="build"></div>
    <button class="btn" id="tossBtn">摇卦（1/6）</button>
    <button class="btn ghost hidden" id="resetBtn">重新起卦</button>
  </div>
  <div id="result"></div>
  <div class="card" id="histCard">
    <h2>最近卦例</h2>
    <ul class="hist" id="hist"></ul>
    <button class="btn ghost hidden" id="clearHist">清空记录</button>
  </div>
</section>

<section id="tab-shouxiang" class="hidden">
  <div class="card">
    <h2>看看你的手</h2>
    <p class="hint">先选看哪只手，然后对照示意图一题一题选。可以拍张手掌照片放在旁边对照，<b>照片只在你的手机上显示，不会上传</b>。</p>
    <div class="seg" id="handSeg"><button data-h="L">左手</button><button data-h="R" class="on">右手</button></div>
    <div class="palmgrid">
      <div class="photoBox" id="photoBox">
        <label class="photoPick"><input type="file" id="palmFile" accept="image/*" capture="environment"><span id="photoHint">📷 拍照 / 选照片<br><small>（可选，只在本机显示）</small></span></label>
        <img id="palmImg" class="hidden" alt="你的手掌照片">
        <button class="mini-btn hidden" id="photoClear">移除照片</button>
      </div>
      <div class="svgBox"><svg id="palmSvg" viewBox="0 0 340 400" role="img" aria-label="手掌示意图"></svg><div class="svgcap" id="svgCap"></div></div>
    </div>
  </div>
  <div class="card" id="sxQuiz"></div>
  <div id="sxResult"></div>
  <div class="card disclaimer" id="sxDisc"></div>
</section>

<footer>仅供娱乐参考 · 卦爻经传据通行本《周易》 · 手相据《神相全编》《神相铁关刀》《许负相法》、Cheiro 等</footer>
</div>

<script>
const G=[{"n":1,"name":"乾","full":"乾为天","u":"䷀","up":"乾","lo":"乾","bits":"111111","gua":"元，亨，利，贞。","tuan":"大哉乾元，万物资始，乃统天。云行雨施，品物流形。大明终始，六位时成。时乘六龙以御天。乾道变化，各正性命。保合大和，乃利贞。首出庶物，万国咸宁。","dx":"天行健，君子以自强不息。","lines":[["初九","潜龙，勿用。","“潜龙勿用”，阳在下也。"],["九二","见龙在田，利见大人。","“见龙在田”，德施普也。"],["九三","君子终日乾乾，夕惕若厉，无咎。","“终日乾乾”，反复道也。"],["九四","或跃在渊，无咎。","“或跃在渊”，进无咎也。"],["九五","飞龙在天，利见大人。","“飞龙在天”，大人造也。"],["上九","亢龙，有悔。","“亢龙有悔”，盈不可久也。"]],"bh":{"key":"刚健进取","all":"如日中天，元气充沛，是大展身手的时候，但要守正、防骄满。","job":"积极主动，适合承担重任、开拓新局。","money":"正财稳健，靠实力赚钱，不宜贪快。","love":"以诚相待，别太强势，多体贴对方。","health":"精力旺盛，注意劳逸结合，别透支。"},"yong":["用九","见群龙无首，吉。","“用九”，天德不可为首也。"]},{"n":2,"name":"坤","full":"坤为地","u":"䷁","up":"坤","lo":"坤","bits":"000000","gua":"元亨。利牝马之贞。君子有攸往，先迷，后得主，利。西南得朋，东北丧朋。安贞吉。","tuan":"至哉坤元，万物资生，乃顺承天。坤厚载物，德合无疆。含弘光大，品物咸亨。牝马地类，行地无疆，柔顺利贞。君子攸行，先迷失道，后顺得常。西南得朋，乃与类行。东北丧朋，乃终有庆。安贞之吉，应地无疆。","dx":"地势坤。君子以厚德载物。","lines":[["初六","履霜，坚冰至。","“履霜坚冰”，阴始凝也，驯致其道，至坚冰也。"],["六二","直、方、大，不习，无不利。","六二之动，直以方也。“不习无不利”，地道光也。"],["六三","含章，可贞，或从王事，无成有终。","“含章可贞”，以时发也。“或从王事”，知光大也。"],["六四","括囊，无咎无誉。","“括囊无咎”，慎不害也。"],["六五","黄裳，元吉。","“黄裳元吉”，文在中也。"],["上六","龙战于野，其血玄黄。","“龙战于野”，其道穷也。"]],"bh":{"key":"柔顺包容","all":"厚德载物，宜跟随、配合、踏实积累，不宜抢先出头。","job":"做好辅助与执行，跟对人比单干更顺。","money":"稳中求进，宜储蓄与长线，忌冒进。","love":"温柔包容最得人心，关系稳定。","health":"脾胃宜养，作息规律即可。"},"yong":["用六","利永贞。","用六“永贞”，以大终也。"]},{"n":3,"name":"屯","full":"水雷屯","u":"䷂","up":"坎","lo":"震","bits":"100010","gua":"元亨，利贞。勿用有攸往。利建侯。","tuan":"屯，刚柔始交而难生。动乎险中，大亨贞。雷雨之动满盈，天造草昧。宜建侯而不宁。","dx":"云雷，屯。君子以经纶。","lines":[["初九","磐桓，利居贞。利建侯。","虽磐桓，志行正也。以贵下贱，大得民也。"],["六二","屯如邅如，乘马班如。匪寇，婚媾。女子贞不字，十年乃字。","六二之难，乘刚也。十年乃字，反常也。"],["六三","即鹿无虞，惟入于林中，君子几不如舍，往吝。","“即鹿无虞”，以从禽也。君子舍之，往吝穷也。"],["六四","乘马班如，求婚媾。往吉，无不利。","求而往，明也。"],["九五","屯其膏，小，贞吉；大，贞凶。","“屯其膏”，施未光也。"],["上六","乘马班如，泣血涟如。","“泣血涟如”，何可长也。"]],"bh":{"key":"万事开头难","all":"事情刚起步，困难多但生机足，宜稳扎稳打、找人帮忙。","job":"创业起步期，先打基础、建团队。","money":"资金周转紧，量力而行，别铺太大。","love":"关系萌芽，需要耐心经营。","health":"注意疲劳与小病，别硬扛。"}},{"n":4,"name":"蒙","full":"山水蒙","u":"䷃","up":"艮","lo":"坎","bits":"010001","gua":"亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告。利贞。","tuan":"蒙，山下有险，险而止，蒙。“蒙亨”，以亨行，时中也。“匪我求童蒙，童蒙求我”。志应也。“初筮告”，以刚中也。“再三渎，渎则不告”，渎蒙也。蒙以养正，圣功也。","dx":"山下出泉，蒙。君子以果行育德。","lines":[["初六","发蒙，利用刑人，用说桎梏，以往吝。","“利用刑人”，以正法也。"],["九二","包蒙，吉。纳妇，吉。子克家。","“子克家”，刚柔接也。"],["六三","勿用取女，见金夫，不有躬。无攸利。","“勿用取女”，行不顺也。"],["六四","困蒙，吝。","“困蒙之吝”，独远实也。"],["六五","童蒙，吉。","“童蒙”之“吉”，顺以巽也。"],["上九","击蒙，不利为寇，利御寇。","“利”用“御寇”，上下顺也。"]],"bh":{"key":"启蒙求学","all":"一时看不清方向，虚心请教、多学习就会明朗。","job":"多向前辈学习，打好基本功。","money":"不懂的不投，先学再做。","love":"多沟通少猜疑，真诚是关键。","health":"注意作息，少熬夜。"}},{"n":5,"name":"需","full":"水天需","u":"䷄","up":"坎","lo":"乾","bits":"111010","gua":"有孚，光亨。贞吉，利涉大川。","tuan":"“需”，须也。险在前也，刚健而不陷，其义不困穷矣。“需，有孚，光亨，贞吉”，位乎天位，以正中也。“利涉大川”，往有功也。","dx":"云上于天，需。君子以饮食宴乐。","lines":[["初九","需于郊，利用恒，无咎。","“需于郊”，不犯难行也。“利用恒无咎”，未失常也。"],["九二","需于沙，小有言，终吉。","“需于沙”，衍在中也。虽小有言，以吉终也。"],["九三","需于泥，致寇至。","“需于泥”，灾在外也。自我致寇，敬慎不败也。"],["六四","需于血，出自穴。","“需于血，”顺以听也。"],["九五","需于酒食，贞吉。","“酒食贞吉”，以中正也。"],["上六","入于穴，有不速之客三人来，敬之终吉。","“不速之客来，敬之终吉”，虽不当位，未大失也。"]],"bh":{"key":"耐心等待","all":"时机未到，积蓄力量、耐心等待，自然水到渠成。","job":"不急于求成，准备充分再出手。","money":"守住本金，等待良机。","love":"顺其自然，急不得，缘分会来。","health":"饮食有节，养好身体等时机。"}},{"n":6,"name":"讼","full":"天水讼","u":"䷅","up":"乾","lo":"坎","bits":"010111","gua":"有孚窒惕，中吉，终凶。利见大人。不利涉大川。","tuan":"讼，上刚下险，险而健，讼。“讼有孚窒惕，中吉”，刚来而得中也。“终凶”，讼不可成也。“利见大人”，尚中正也。“不利涉大川”，入于渊也。","dx":"天与水违行，讼。君子以作事谋始。","lines":[["初六","不永所事，小有言，终吉。","“不永所事”，讼不可长也。虽“小有言”，其辩明也。"],["九二","不克讼，归而逋。其邑人三百户，无眚。","“不克讼”，归逋窜也。自下讼上，患至掇也。"],["六三","食旧德，贞厉，终吉。或从王事，无成。","食旧德，从上吉也。"],["九四","不克讼，复即命渝。安贞吉。","复即命渝，安贞不失也。"],["九五","讼，元吉。","“讼，元吉”以中正也。"],["上九","或锡之鞶带，终朝三褫之。","以讼受服，亦不足敬也。"]],"bh":{"key":"争讼宜和","all":"易有争执分歧，退一步海阔天空，和为贵。","job":"避免正面冲突，凡事立好规矩、留好证据。","money":"谨防合同纠纷，不宜打官司求财。","love":"少争对错，多讲感受。","health":"心平气和，防上火、失眠。"}},{"n":7,"name":"师","full":"地水师","u":"䷆","up":"坤","lo":"坎","bits":"010000","gua":"贞丈人吉，无咎。","tuan":"师，众也。贞，正也。能以众正，可以王矣。刚中而应，行险而顺，以此毒天下，而民从之，吉又何咎矣。","dx":"地中有水，师。君子以容民畜众。","lines":[["初六","师出以律，否臧凶。","“师出以律，”失律凶也。"],["九二","在师中吉，无咎，王三锡命。","“在师中吉”，承天宠也。“王三锡命”，怀万邦也。"],["六三","师或舆尸，凶。","“师或舆尸”，大无功也。"],["六四","师左次，无咎。","“左次无咎”，未失常也。"],["六五","田有禽。利执言，无咎。长子帅师，弟子舆尸，贞凶。","“长子帅师”，以中行也。“弟子舆尸”，使不当也。"],["上六","大君有命，开国承家，小人勿用。","“大君有命”，以正功也。“小人勿用”，必乱邦也。"]],"bh":{"key":"统率用众","all":"需要组织与纪律，用正当方法、得人心，才能成事。","job":"适合带团队、做项目管理，赏罚分明。","money":"按计划理财，纪律胜于运气。","love":"需要担当，少些控制欲。","health":"注意劳累和外伤。"}},{"n":8,"name":"比","full":"水地比","u":"䷇","up":"坎","lo":"坤","bits":"000010","gua":"吉。原筮，元，永贞，无咎。不宁方来，后夫凶。","tuan":"比，吉也；比，辅也，下顺从也。“原筮，元永贞，无咎”，以刚中也。“不宁方来”，上下应也。“后夫凶”，其道穷也。","dx":"地上有水，比。先王以建万国，亲诸侯。","lines":[["初六","有孚比之，无咎。有孚盈缶，终来有它，吉。","比之初六，有它吉也。"],["六二","比之自内，贞吉。","“比之自内”，不自失也。"],["六三","比之匪人。","“比之匪人”，不亦伤乎？"],["六四","外比之，贞吉。","外比于贤，以从上也。"],["九五","显比，王用三驱，失前禽，邑人不诫，吉。","“显比”之吉，位正中也。舍逆取顺，失前禽也。邑人不诫，上使中也。"],["上六","比之无首，凶。","“比之无首”，无所终也。"]],"bh":{"key":"亲附和睦","all":"人缘好，团结合作，选对伙伴就能得助。","job":"多合作、多联络，贵人在身边。","money":"合伙求财有利，但要选可信之人。","love":"真心相待，关系亲密，宜早表态。","health":"心情舒畅，身体平稳。"}},{"n":9,"name":"小畜","full":"风天小畜","u":"䷈","up":"巽","lo":"乾","bits":"111011","gua":"亨。密云不雨。自我西郊。","tuan":"“小畜”，柔得位而上下应之，曰小畜。健而巽，刚中而志行，乃亨。“密云不雨”，尚往也。“自我西郊”，施未行也。","dx":"风行天上，“小畜”。君子以懿文德。","lines":[["初九","复自道，何其咎？吉。","“复自道”，其义“吉”也。"],["九二","牵复，吉。","牵复在中，亦不自失也。"],["九三","舆说辐。夫妻反目。","“夫妻反目”，不能正室也。"],["六四","有孚，血去，惕出无咎。","“有孚惕出”，上合志也。"],["九五","有孚挛如，富以其邻。","“有孚挛如”，不独富也。"],["上九","既雨既处，尚德载。妇贞厉。月几望，君子征凶。","“既雨既处”，德积载也。“君子征凶”，有所疑也。"]],"bh":{"key":"小有积蓄","all":"力量还小，宜积少成多，不宜大动作。","job":"小步前进，先把细节做好。","money":"小财可得，积累为主。","love":"有小摩擦，多点耐心。","health":"小毛病注意调养。"}},{"n":10,"name":"履","full":"天泽履","u":"䷉","up":"乾","lo":"兑","bits":"110111","gua":"履虎尾，不咥人。亨。","tuan":"“履”，柔履刚也。说而应乎乾，是以“履虎尾，不咥人”。亨，刚中正，履帝位而不疚，光明也。","dx":"上天下泽，“履”。君子以辨上下，定民志。","lines":[["初九","素履往，无咎。","“素履之往”，独行愿也。"],["九二","履道坦坦，幽人贞吉。","“幽人贞吉”，中不自乱也。"],["六三","眇能视，跛能履，履虎尾，咥人，凶。武人为于大君。","“眇能视”，不足以有明也。“跛能履”，不足以与行也。“咥人之凶”，位不当也。“武人为于大君”，志刚也。"],["九四","履虎尾，愬愬，终吉。","“愬愬终吉”。志行也。"],["九五","夬履，贞厉。","“夬履贞厉”，位正当也。"],["上九","视履考祥，其旋元吉。","元吉在上，大有庆也。"]],"bh":{"key":"如履虎尾","all":"处境需谨慎，守礼守规矩，小心行事反而平安。","job":"按规矩办事，尊重上级，慎言慎行。","money":"谨慎投资，避开高风险。","love":"礼貌尊重，别冒进。","health":"注意安全，防意外磕碰。"}},{"n":11,"name":"泰","full":"地天泰","u":"䷊","up":"坤","lo":"乾","bits":"111000","gua":"小往大来，吉，亨。","tuan":"“泰，小往大来。吉，亨。”则是天地交而万物通也，上下交而其志同也。内阳而外阴，内健而外顺，内君子而外小人，君子道长，小人道消也。","dx":"天地交，泰。后以财成天地之道，辅相天地之宜，以左右民。","lines":[["初九","拔茅茹，以其汇。征吉。","“拔茅征吉”，志在外也。"],["九二","包荒，用冯河，不遐遗。朋亡，得尚于中行。","“包荒，得尚于中行”，以光大也。"],["九三","无平不陂，无往不复。艰贞无咎。勿恤其孚，于食有福。","“无往不复”，天地际也。"],["六四","翩翩，不富以其邻，不戒以孚。","“翩翩，不富”，皆失实也。“不戒以孚”，中心愿也。"],["六五","帝乙归妹，以祉元吉。","“以祉元吉”，中以行愿也。"],["上六","城复于隍，勿用师，自邑告命。贞吝。","“城复于隍”，其命乱也。"]],"bh":{"key":"通泰顺遂","all":"天地相交，上下通畅，各方面都顺利，宜珍惜好运。","job":"沟通顺畅，合作愉快，适合推进计划。","money":"财运亨通，但盛时要留余地。","love":"感情和美，适合确定关系。","health":"身心舒泰，保持好习惯。"}},{"n":12,"name":"否","full":"天地否","u":"䷋","up":"乾","lo":"坤","bits":"000111","gua":"否之匪人，不利君子贞，大往小来。","tuan":"“否之匪人，不利君子贞，大往小来。”则是天地不交而万物不通也，上下不交而天下无邦也；内阴而外阳，内柔而外刚，内小人而外君子，小人道长，君子道消也。","dx":"天地不交，“否”。君子以俭德辟难，不可荣以禄。","lines":[["初六","拔茅茹以其汇。贞吉，亨。","“拔茅贞吉”，志在君也。"],["六二","包承，小人吉，大人否。亨。","“大人否亨”，不乱群也。"],["六三","包羞。","“包羞”，位不当也。"],["九四","有命，无咎，畴离祉。","“有命无咎”，志行也。"],["九五","休否，大人吉。其亡其亡，系于苞桑。","大人之吉，位正当也。"],["上九","倾否，先否后喜。","否终则倾，何可长也。"]],"bh":{"key":"闭塞不通","all":"一时不顺、沟通受阻，宜守不宜攻，静待转机。","job":"低调做事，避免冒进，坚持原则。","money":"保守理财，少出手。","love":"多给空间，避免冷战。","health":"注意情绪低落，多出门走走。"}},{"n":13,"name":"同人","full":"天火同人","u":"䷌","up":"乾","lo":"离","bits":"101111","gua":"同人于野，亨。利涉大川。利君子贞。","tuan":"“同人”，柔得位得中，而应乎乾，曰同人。同人曰：“同人于野，亨。利涉大川”，乾行也。文明以健，中正而应，君子正也。唯君子为能通天下之志。","dx":"天与火，同人。君子以类族辨物。","lines":[["初九","同人于门，无咎。","“出门同人”，又谁咎也。"],["六二","同人于宗，吝。","“同人于宗”，吝道也。"],["九三","伏戎于莽，升其高陵，三岁不兴。","“伏戎于莽”，敌刚也。“三岁不兴”，安行也。"],["九四","乘其墉，弗克攻，吉。","“乘其墉”，义弗克也。其“吉”，则困而反则也。"],["九五","同人先号咷而后笑，大师克，相遇。","同人之先，以中直也。大师相遇，言相克也。"],["上九","同人于郊，无悔。","“同人于郊”，志未得也。"]],"bh":{"key":"志同道合","all":"与人同心，广结善缘，公开透明能成大事。","job":"团队合作是关键，求同存异。","money":"合作生财，账目要清楚。","love":"志趣相投，适合一起规划未来。","health":"结伴运动，有益身心。"}},{"n":14,"name":"大有","full":"火天大有","u":"䷍","up":"离","lo":"乾","bits":"111101","gua":"元亨。","tuan":"“大有”，柔得尊位大中，而上下应之，曰“大有”。其德刚健而文明，应乎天而时行，是以元亨。","dx":"火在天上，“大有”。君子以遏恶扬善，顺天休命。","lines":[["初九","无交害匪咎。艰则无咎。","大有初九，无交害也。"],["九二","大车以载，有攸往，无咎。","“大车以载”，积中不败也。"],["九三","公用亨于天子，小人弗克。","公用亨于天子，小人害也。"],["九四","匪其彭，无咎。","“匪其彭，无咎。”明辨晢也。"],["六五","厥孚交如威如，吉。","“厥孚交如”，信以发志也。“威如之吉”，易而无备也。"],["上九","自天祐之，吉，无不利。","大有上吉，自天祐也。"]],"bh":{"key":"大有收获","all":"光明富足，收获丰厚，宜谦虚分享，守住成果。","job":"成绩显著，得人赏识，宜乘势而上。","money":"财运旺，记得惜福、分享。","love":"感情美满，彼此欣赏。","health":"状态好，防饮食过度。"}},{"n":15,"name":"谦","full":"地山谦","u":"䷎","up":"坤","lo":"艮","bits":"001000","gua":"亨。君子有终。","tuan":"谦，亨。天道下济而光明，地道卑而上行。天道亏盈而益谦，地道变盈而流谦，鬼神害盈而福谦，人道恶盈而好谦。谦，尊而光，卑而不可逾，君子之终也。","dx":"地中有山，谦。君子以裒多益寡，称物平施。","lines":[["初六","谦谦君子，用涉大川，吉。","“谦谦君子”，卑以自牧也。"],["六二","鸣谦，贞吉。","“鸣谦贞吉”，中心得也。"],["九三","劳谦君子，有终，吉。","“劳谦君子”，万民服也。"],["六四","无不利，㧑谦。","“无不利，㧑谦”，不违则也。"],["六五","不富以其邻，利用侵伐，无不利。","“利用侵伐”，征不服也。"],["上六","鸣谦，利用行师征邑国。","“鸣谦”，志未得也。“可用行师”，征邑国也。"]],"bh":{"key":"谦虚受益","all":"谦虚低调的人最终得益，退让中反而得到更多。","job":"踏实谦和，口碑好，自然被提拔。","money":"稳中有得，不炫富。","love":"谦和体贴，感情长久。","health":"心态平和，身体平稳。"}},{"n":16,"name":"豫","full":"雷地豫","u":"䷏","up":"震","lo":"坤","bits":"000100","gua":"利建侯行师。","tuan":"豫，刚应而志行，顺以动，豫。豫顺以动，故天地如之，而况建侯行师乎？天地以顺动，故日月不过，而四时不忒。圣人以顺动，则刑罚清而民服，豫之时义大矣哉！","dx":"雷出地奋，豫。先王以作乐崇德，殷荐之上帝，以配祖考。","lines":[["初六","鸣豫，凶。","“初六鸣豫”，志穷凶也。"],["六二","介于石，不终日，贞吉。","“不终日贞吉”，以中正也。"],["六三","盱豫，悔，迟有悔。","“盱豫有悔”，位不当也。"],["九四","由豫，大有得，勿疑。朋盍簪。","“由豫大有得”，志大行也。"],["六五","贞疾，恒不死。","“六五贞疾”，乘刚也。“恒不死”，中未亡也。"],["上六","冥豫，成有渝。无咎。","“冥豫”在上，何可长也？"]],"bh":{"key":"欢乐顺意","all":"心情愉快，顺势而为，但防安逸懈怠。","job":"时机不错，提早准备更顺利。","money":"有进账，娱乐开销要节制。","love":"甜蜜愉快，别只顾玩乐。","health":"防贪玩熬夜。"}},{"n":17,"name":"随","full":"泽雷随","u":"䷐","up":"兑","lo":"震","bits":"100110","gua":"元亨，利贞，无咎。","tuan":"随，刚来而下柔，动而说，随。大亨贞无咎，而天下随时，随时之义大矣哉！","dx":"泽中有雷，随。君子以向晦入宴息。","lines":[["初九","官有渝，贞吉，出门交有功。","“官有渝”，从正吉也。“出门交有功”，不失也。"],["六二","系小子，失丈夫。","“系小子”，弗兼与也。"],["六三","系丈夫，失小子，随有求，得。利居贞。","“系丈夫”，志舍下也。"],["九四","随有获，贞凶。有孚在道，以明，何咎？","“随有获”，其义凶也。“有孚在道”，明功也。"],["九五","孚于嘉，吉。","“孚于嘉吉”，位正中也。"],["上六","拘系之，乃从维之，王用亨于西山。","“拘系之”，上穷也。"]],"bh":{"key":"随机应变","all":"顺应时势、择善而从，灵活变通会更顺。","job":"跟随好的领导或趋势，有收获。","money":"跟随大势，不逆势操作。","love":"相互迁就，关系融洽。","health":"作息随季节调整。"}},{"n":18,"name":"蛊","full":"山风蛊","u":"䷑","up":"艮","lo":"巽","bits":"011001","gua":"元亨。利涉大川，先甲三日，后甲三日。","tuan":"蛊，刚上而柔下，巽而止，蛊。蛊，元亨而天下治也。“利涉大川”，往有事也。“先甲三日，后甲三日”，终则有始，天行也。","dx":"山下有风，蛊。君子以振民育德。","lines":[["初六","干父之蛊，有子，考无咎。厉，终吉。","“干父之蛊”，意承考也。"],["九二","干母之蛊，不可贞。","“干母之蛊”，得中道也。"],["九三","干父之蛊，小有悔，无大咎。","“干父之蛊”，终无咎也。"],["六四","裕父之蛊，往见吝。","“裕父之蛊”，往未得也。"],["六五","干父之蛊，用誉。","“干父用誉”，承以德也。"],["上九","不事王侯，高尚其事。","“不事王侯”，志可则也。"]],"bh":{"key":"整治革新","all":"积弊需要整改，勇于纠错、除旧布新就有转机。","job":"适合改进流程、解决遗留问题。","money":"清理旧账，止损再出发。","love":"把旧矛盾说开，重新开始。","health":"调整不良习惯，正当时。"}},{"n":19,"name":"临","full":"地泽临","u":"䷒","up":"坤","lo":"兑","bits":"110000","gua":"元亨，利贞。至于八月有凶。","tuan":"临，刚浸而长，说而顺，刚中而应。大亨以正，天之道也。“至于八月有凶”，消不久也。","dx":"泽上有地，临。君子以教思无穷，容保民无疆。","lines":[["初九","咸临，贞吉。","“咸临贞吉”，志行正也。"],["九二","咸临，吉，无不利。","“咸临吉无不利”，未顺命也。"],["六三","甘临，无攸利；既忧之，无咎。","“甘临”，位不当也。“既忧之”。咎不长也。"],["六四","至临，无咎。","“至临无咎”，位当也。"],["六五","知临，大君之宜，吉。","“大君之宜”，行中之谓也。"],["上六","敦临，吉，无咎。","“敦临之吉”，志在内也。"]],"bh":{"key":"亲临督导","all":"好运渐来，宜主动亲近、积极行动，但要防盛极而衰。","job":"机会上门，主动把握，亲力亲为。","money":"财运上升，趁势而为、见好就收。","love":"感情升温，主动表达。","health":"整体向好，注意季节变化。"}},{"n":20,"name":"观","full":"风地观","u":"䷓","up":"巽","lo":"坤","bits":"000011","gua":"盥而不荐。有孚颙若。","tuan":"大观在上，顺而巽，中正以观天下，观。“盥而不荐，有孚颙若”，下观而化也。观天之神道，而四时不忒，圣人以神道设教，而天下服矣。","dx":"风行地上，观。先王以省方观民设教。","lines":[["初六","童观，小人无咎，君子吝。","“初六童观”，“小人”道也。"],["六二","窥观，利女贞。","“窥观女贞”，亦可丑也。"],["六三","观我生，进退。","“观我生进退”，未失道也。"],["六四","观国之光，利用宾于王。","“观国之光”，尚宾也。"],["九五","观我生，君子无咎。","“观我生”，观民也。"],["上九","观其生，君子无咎。","“观其生”，志未平也。"]],"bh":{"key":"观察审视","all":"先观察再行动，以身作则，眼界决定格局。","job":"多看多想，审时度势。","money":"多做研究，暂缓出手。","love":"多观察对方真心，再做决定。","health":"静养为主，适度放松。"}},{"n":21,"name":"噬嗑","full":"火雷噬嗑","u":"䷔","up":"离","lo":"震","bits":"100101","gua":"亨。利用狱。","tuan":"颐中有物曰噬嗑。噬嗑而亨，刚柔分，动而明，雷电合而章。柔得中而上行，虽不当位，利用狱也。","dx":"雷电，噬嗑。先王以明罚敕法。","lines":[["初九","屦校灭趾，无咎。","“屦校灭趾”，不行也。"],["六二","噬肤灭鼻，无咎。","“噬肤灭鼻”，乘刚也。"],["六三","噬腊肉遇毒，小吝，无咎。","“遇毒”，位不当也。"],["九四","噬干胏，得金矢。利艰贞，吉。","“利艰贞吉”，未光也。"],["六五","噬干肉得黄金。贞厉，无咎。","“贞厉无咎”，得当也。"],["上九","何校灭耳，凶。","“何校灭耳”，聪不明也。"]],"bh":{"key":"明断除障","all":"遇到阻碍，要果断处理、明辨是非，问题才能解决。","job":"敢于处理难题，依规办事。","money":"注意纠纷，合同条款要清楚。","love":"有误会就当面说清。","health":"注意口腔、饮食卫生。"}},{"n":22,"name":"贲","full":"山火贲","u":"䷕","up":"艮","lo":"离","bits":"101001","gua":"亨。小利有攸往。","tuan":"贲亨，柔来而文刚，故亨。分，刚上而文柔，故小利有攸往。刚柔交错，天文也。文明以止，人文也。观乎天文，以察时变；观乎人文，以化成天下。","dx":"山下有火，贲。君子以明庶政，无敢折狱。","lines":[["初九","贲其趾，舍车而徒。","“舍车而徒”，义弗乘也。"],["六二","贲其须。","“贲其须”，与上兴也。"],["九三","贲如，濡如，永贞吉。","“永贞之吉”，终莫之陵也。"],["六四","贲如皤如，白马翰如。匪寇，婚媾。","六四，当位疑也。“匪寇婚媾”，终无尤也。"],["六五","贲于丘园，束帛戋戋，吝，终吉。","“六五之吉”，有喜也。"],["上九","白贲，无咎。","“白贲无咎”，上得志也。"]],"bh":{"key":"文饰美化","all":"注重外在与礼仪，有好气象，但别只重表面。","job":"包装与形象有助发展，内容更重要。","money":"小财顺利，别为面子乱花。","love":"浪漫美好，也要实在相处。","health":"适度打扮，心情好身体好。"}},{"n":23,"name":"剥","full":"山地剥","u":"䷖","up":"艮","lo":"坤","bits":"000001","gua":"不利有攸往。","tuan":"剥，剥也。柔变刚也。“不利有攸往”，小人长也。顺而止之，观象也。君子尚消息盈虚，天行也。","dx":"山附于地，剥。上以厚下安宅。","lines":[["初六","剥床以足，蔑贞凶。","“剥床以足”，以灭下也。"],["六二","剥床以辨，蔑贞凶。","“剥床以辨”，未有与也。"],["六三","剥之，无咎。","“剥之无咎”，失上下也。"],["六四","剥床以肤，凶。","“剥床以肤”，切近灾也。"],["六五","贯鱼以宫人宠，无不利。","“以宫人宠”，终无尤也。"],["上九","硕果不食，君子得舆，小人剥庐。","“君子得舆”，民所载也。“小人剥庐”，终不可用也。"]],"bh":{"key":"剥落衰退","all":"形势走弱，宜守不宜进，保存实力等待转机。","job":"低调守成，不宜大动作。","money":"保住资产，防小人和损失。","love":"少计较，耐心维护。","health":"注意休息，防抵抗力下降。"}},{"n":24,"name":"复","full":"地雷复","u":"䷗","up":"坤","lo":"震","bits":"100000","gua":"亨。出入无疾。朋来无咎。反复其道，七日来复，利有攸往。","tuan":"“复，亨”。刚反，动而以顺行。是以“出入无疾，朋来无咎”。“反复其道，七日来复”，天行也。“利有攸往”，刚长也。复，其见天地之心乎。","dx":"雷在地中，复。先王以至日闭关，商旅不行，后不省方。","lines":[["初九","不远复，无祗悔，元吉。","“不远之复”，以修身也。"],["六二","休复，吉。","“休复之吉”，以下仁也。"],["六三","频复，厉，无咎。","“频复之厉”，义无咎也。"],["六四","中行独复。","“中行独复”，以从道也。"],["六五","敦复，无悔。","“敦复无悔”，中以自考也。"],["上六","迷复，凶，有灾眚。用行师，终有大败，以其国君凶，至于十年不克征。","“迷复之凶”，反君道也。"]],"bh":{"key":"一阳来复","all":"低谷已过，好运开始回来，宜重新出发、循序渐进。","job":"重新起步，机会慢慢回来。","money":"财运回升，先小试牛刀。","love":"旧情或旧缘有复合迹象。","health":"身体逐步恢复。"}},{"n":25,"name":"无妄","full":"天雷无妄","u":"䷘","up":"乾","lo":"震","bits":"100111","gua":"元亨，利贞。其匪正有眚，不利有攸往。","tuan":"无妄，刚自外来而为主于内，动而健，刚中而应。大亨以正，天之命也。“其匪正有眚，不利有攸往”，无妄之往何之矣？天命不祐，行矣哉！","dx":"天下雷行，物与无妄。先王以茂对时育万物。","lines":[["初九","无妄往，吉。","“无妄之往”，得志也。"],["六二","不耕获，不菑畬，则利有攸往。","“不耕获”，未富也。"],["六三","无妄之灾，或系之牛，行人之得，邑人之灾。","行人得牛，邑人灾也。"],["九四","可贞。无咎。","“可贞无咎”，固有之也。"],["九五","无妄之疾，勿药有喜。","“无妄之药”，不可试也。"],["上九","无妄行，有眚，无攸利。","“无妄之行”，穷之灾也。"]],"bh":{"key":"真诚无妄","all":"顺其自然、真诚做事就好，不要投机取巧。","job":"踏实本分，不走捷径。","money":"不宜投机，意外之财别强求。","love":"真诚最重要，不耍心机。","health":"防意外，规律生活。"}},{"n":26,"name":"大畜","full":"山天大畜","u":"䷙","up":"艮","lo":"乾","bits":"111001","gua":"利贞。不家食吉。利涉大川。","tuan":"大畜，刚健笃实，辉光日新。其德刚上而尚贤，能止健，大正也。“不家食吉”，养贤也。“利涉大川”，应乎天也。","dx":"天在山中，大畜。君子以多识前言往行，以畜其德。","lines":[["初九","有厉，利已。","“有厉利已”，不犯灾也。"],["九二","舆说輹。","“舆说輹”，中无尤也。"],["九三","良马逐，利艰贞，曰闲舆卫，利有攸往。","“利有攸往”，上合志也。"],["六四","童牛之牿，元吉。","“六四元吉”，有喜也。"],["六五","豮豕之牙，吉。","“六五之吉”，有庆也。"],["上九","何天之衢，亨。","“何天之衢”，道大行也。"]],"bh":{"key":"大有积蓄","all":"积累深厚，适合学习充电、厚积薄发，时机成熟可大干。","job":"储备实力，适时出手可成大事。","money":"积蓄丰厚，宜稳健投资。","love":"稳定发展，适合共同规划。","health":"养精蓄锐，状态佳。"}},{"n":27,"name":"颐","full":"山雷颐","u":"䷚","up":"艮","lo":"震","bits":"100001","gua":"贞吉。观颐，自求口实。","tuan":"颐，贞吉，养正则吉也。观颐，观其所养也。自求口实，观其自养也。天地养万物，圣人养贤以及万民，颐之时大矣哉！","dx":"山下有雷，颐。君子以慎言语，节饮食。","lines":[["初九","舍尔灵龟，观我朵颐，凶。","“观我朵颐”，亦不足贵也。"],["六二","颠颐拂经于丘颐，征凶。","“六二征凶”，行失类也。"],["六三","拂颐，贞凶，十年勿用，无攸利。","“十年勿用”，道大悖也。"],["六四","颠颐，吉。虎视眈眈，其欲逐逐，无咎。","“颠颐之吉”，上施光也。"],["六五","拂经，居贞吉，不可涉大川。","“居贞之吉”，顺以从上也。"],["上九","由颐，厉，吉。利涉大川。","“由颐厉吉”，大有庆也。"]],"bh":{"key":"颐养之道","all":"注意养身养心，言语饮食都要节制，自立更生。","job":"靠真本事吃饭，慎言。","money":"量入为出，节制开销。","love":"多关心对方生活起居。","health":"重视饮食与口腔健康。"}},{"n":28,"name":"大过","full":"泽风大过","u":"䷛","up":"兑","lo":"巽","bits":"011110","gua":"栋桡，利有攸往，亨。","tuan":"“大过”，大者过也。“栋桡”，本末弱也。刚过而中，巽而说，行。利有攸往，乃亨。“大过”之时大矣哉！","dx":"泽灭木，大过。君子以独立不惧，遯世无闷。","lines":[["初六","藉用白茅，无咎。","“藉用白茅”，柔在下也。"],["九二","枯杨生稊，老夫得其女妻，无不利。","“老夫女妻，”，过以相与也。"],["九三","栋桡，凶。","“栋桡”之“凶”，不可以有辅也。"],["九四","栋隆，吉。有它，吝。","“栋隆之吉”，不桡乎下也。"],["九五","枯杨生华，老妇得其士夫，无咎无誉。","“枯杨生华”，何可久也。“老妇士夫”，亦可丑也。"],["上六","过涉灭顶，凶。无咎。","“过涉之凶”，不可咎也。"]],"bh":{"key":"负担过重","all":"压力偏大、责任过重，需要非常手段或寻求支援。","job":"别一人扛，适当分担与调整。","money":"防资金压力过大，减少负债。","love":"关系有失衡，需要平衡付出。","health":"注意劳累过度，多休息。"}},{"n":29,"name":"坎","full":"坎为水","u":"䷜","up":"坎","lo":"坎","bits":"010010","gua":"有孚维心，亨。行有尚。","tuan":"“习坎”，重险也。水流而不盈。行险而不失其信。维心亨，乃以刚中也。“行有尚”，往有功也。天险，不可升也。地险，山川丘陵也。王公设险以守其国。险之时用大矣哉！","dx":"水洊至，习坎。君子以常德行，习教事。","lines":[["初六","习坎，入于坎，窞，凶。","“习坎入坎”，失道，凶也。"],["九二","坎有险，求小得。","“求小得”，未出中也。"],["六三","来之坎，坎险且枕，入于坎，窞，勿用。","“来之坎坎”，终无功也。"],["六四","樽酒簋贰用缶，纳约自牖，终无咎。","“樽酒簋贰”，刚柔际也。"],["九五","坎不盈，祗既平，无咎。","“坎不盈”，中未大也。"],["上六","系用徽纆，寘于丛棘，三岁不得，凶。","上六失道，凶三岁也。"]],"bh":{"key":"重重险阻","all":"困难接连而来，保持诚信与镇定，一步步走出去。","job":"谨慎应对，坚持原则，终会过关。","money":"防财务风险，不宜冒险。","love":"多些信任，共渡难关。","health":"注意肾、泌尿与寒湿。"}},{"n":30,"name":"离","full":"离为火","u":"䷝","up":"离","lo":"离","bits":"101101","gua":"利贞。亨。畜牝牛吉。","tuan":"离，丽也。日月丽乎天，百谷草木丽乎土。重明以丽乎正，乃化成天下。柔丽乎中正，故亨，是以“畜牝牛吉”也。","dx":"明两作，离。大人以继明照于四方。","lines":[["初九","履错然，敬之无咎。","“履错之敬”，以辟咎也。"],["六二","黄离，元吉。","“黄离元吉”，得中道也。"],["九三","日昃之离，不鼓缶而歌，则大耋之嗟，凶。","“日昃之离”，何可久也？"],["九四","突如，其来如，焚如，死如，弃如。","“突如其来如”，无所容也。"],["六五","出涕沱若，戚嗟若，吉。","六五之吉，离王公也。"],["上九","王用出征，有嘉折首，获匪其丑，无咎。","“王用出征”，以正邦也。"]],"bh":{"key":"光明依附","all":"光明美丽，宜依附正道、发挥才华，也要守柔。","job":"才华得以展现，与人合作更旺。","money":"财运不错，靠专长赚钱。","love":"热情有吸引力，防一时冲动。","health":"注意眼睛与心火。"}},{"n":31,"name":"咸","full":"泽山咸","u":"䷞","up":"兑","lo":"艮","bits":"001110","gua":"亨。利贞。取女吉。","tuan":"咸，感也。柔上而刚下，二气感应以相与。止而说，男下女，是以“亨利贞，取女吉”也。天地感而万物化生，圣人感人心而天下和平。观其所感，而天地万物之情可见矣。","dx":"山上有泽，咸。君子以虚受人。","lines":[["初六","咸其拇。","“咸其拇”，志在外也。"],["六二","咸其腓，凶。居吉。","虽“凶居吉”，顺不害也。"],["九三","咸其股，执其随，往吝。","“咸其股”，亦不处也。志在随人，所执下也。"],["九四","贞吉。悔亡。憧憧往来，朋从尔思。","“贞吉悔亡”，未感害也。“憧憧往来”，未光大也。"],["九五","咸其脢，无悔。","“咸其脢”，志末也。"],["上六","咸其辅颊舌。","“咸其辅颊舌”，滕口说也。"]],"bh":{"key":"感应相通","all":"心有灵犀，感情与人际最顺，以真心感动人。","job":"人际顺畅，沟通容易打动人。","money":"靠人脉得财。","love":"感情佳兆，适合恋爱婚嫁。","health":"身心愉悦，注意适度。"}},{"n":32,"name":"恒","full":"雷风恒","u":"䷟","up":"震","lo":"巽","bits":"011100","gua":"亨。无咎。利贞。利有攸往。","tuan":"恒，久也。刚上而柔下。雷风相与，巽而动，刚柔皆应，恒。“恒亨无咎利贞”，久于其道也。天地之道恒久而不已也。“利有攸往”，终则有始也。日月得天而能久照，四时变化而能久成。圣人久于其道而天下化成。观其所恒，而天地万物之情可见矣。","dx":"雷风，恒。君子以立不易方。","lines":[["初六","浚恒，贞凶，无攸利。","“浚恒”之“凶”，始求深也。"],["九二","悔亡。","九二“悔亡”，能久中也。"],["九三","不恒其德，或承之羞，贞吝。","“不恒其德”，无所容也。"],["九四","田无禽。","久非其位，安得禽也。"],["六五","恒其德，贞，妇人吉，夫子凶。","妇人贞吉，从一而终也。夫子制义，从妇凶也。"],["上六","振恒，凶。","振恒在上，大无功也。"]],"bh":{"key":"持之以恒","all":"贵在坚持，守住正道、长期经营，会有好结果。","job":"稳定岗位、长期项目有利。","money":"长期投资优于短线。","love":"长久稳定，适合承诺。","health":"坚持运动，效果显著。"}},{"n":33,"name":"遯","full":"天山遯","u":"䷠","up":"乾","lo":"艮","bits":"001111","gua":"亨。小利贞。","tuan":"“遯亨”，遯而亨也。刚当位而应，与时行也。“小利贞”，浸而长也。遯之时义大矣哉！","dx":"天下有山，遯。君子以远小人，不恶而严。","lines":[["初六","遯尾，厉，勿用有攸往。","“遯尾”之“厉”，不往何灾也？"],["六二","执之用黄牛之革，莫之胜说。","“执用黄牛”，固志也。"],["九三","系遯，有疾厉，畜臣妾吉。","“系遯”之“厉”，有疾惫也。“畜臣妾吉”，不可大事也。"],["九四","好遯，君子吉，小人否。","“君子好遯，小人否”也。"],["九五","嘉遯，贞吉。","“嘉遯贞吉”，以正志也。"],["上九","肥遯，无不利。","“肥遯无不利”，无所疑也。"]],"bh":{"key":"适时退避","all":"形势不利时退一步保全自己，退是为了更好地进。","job":"避开是非，暂时低调。","money":"见好就收，保住成果。","love":"保持距离，冷静处理。","health":"多休养，远离压力源。"}},{"n":34,"name":"大壮","full":"雷天大壮","u":"䷡","up":"震","lo":"乾","bits":"111100","gua":"利贞。","tuan":"大壮，大者壮也。刚以动，故壮。“大壮利贞”，大者正也。正大，而天地之情可见矣。","dx":"雷在天上，大壮。君子以非礼弗履。","lines":[["初九","壮于趾，征凶，有孚。","“壮于趾”，其孚穷也。"],["九二","贞吉。","九二“贞吉”，以中也。"],["九三","小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。","“小人用壮”，君子罔也。"],["九四","贞吉，悔亡。藩决不羸，壮于大舆之輹。","“藩决不羸”，尚往也。"],["六五","丧羊于易，无悔。","“丧羊于易”，位不当也。"],["上六","羝羊触藩，不能退，不能遂，无攸利，艰则吉。","“不能退，不能遂”，不详也。“艰则吉”，咎不长也。"]],"bh":{"key":"声势壮大","all":"气势正旺，但壮而不可妄动，守正才能长久。","job":"实力强，宜稳扎稳打，别硬来。","money":"财运旺，防冲动消费。","love":"热情高，也要尊重对方。","health":"精力足，防运动伤害。"}},{"n":35,"name":"晋","full":"火地晋","u":"䷢","up":"离","lo":"坤","bits":"000101","gua":"康侯用锡马蕃庶，昼日三接。","tuan":"晋，进也，明出地上。顺而丽乎大明，柔进而上行，是以“康侯用锡马蕃庶，昼日三接”也。","dx":"明出地上，《晋》。君子以自昭明德。","lines":[["初六","晋如摧如，贞吉。罔孚，裕无咎。","“晋如摧如”，独行正也。“裕无咎”。未受命也。"],["六二","晋如，愁如，贞吉。受兹介福于，其王母。","“受兹介福”，以中正也。"],["六三","众允，悔亡。","“众允”之志，上行也。"],["九四","晋如鼫鼠，贞厉。","“鼫鼠贞厉”，位不当也。"],["六五","悔亡，失得，勿恤。往吉，无不利。","“失得勿恤”，往有庆也。"],["上九","晋其角，维用伐邑，厉吉，无咎，贞吝。","“维用伐邑”，道未光也。"]],"bh":{"key":"晋升向上","all":"如旭日东升，步步高升，宜积极进取。","job":"晋升有望，表现易被看见。","money":"收入上升。","love":"感情顺利，关系推进。","health":"精神好，注意别太累。"}},{"n":36,"name":"明夷","full":"地火明夷","u":"䷣","up":"坤","lo":"离","bits":"101000","gua":"利艰贞。","tuan":"明入地中，“明夷”。内文明而外柔顺，以蒙大难，文王以之。“利艰贞”，晦其明也，内难而能正其志，箕子以之。","dx":"明入地中，“明夷”。君子以莅众用晦而明。","lines":[["初九","明夷，于飞垂其翼。君子于行，三日不食。有攸往，主人有言。","“君子于行”，义不食也。"],["六二","明夷夷于左股，用拯马壮，吉。","六二之吉，顺以则也。"],["九三","明夷于南狩，得其大首，不可疾贞。","“南狩”之志，乃大得也。"],["六四","入于左腹，获明夷之心，于出门庭。","“入于左腹”，获心意也。"],["六五","箕子之明夷，利贞。","箕子之贞，明不可息也。"],["上六","不明，晦，初登于天，后入于地。","“初登于天”，照四国也。“后入于地”，失则也。"]],"bh":{"key":"光明受损","all":"处境暗淡，宜韬光养晦、内明外柔，等天亮。","job":"低调做事，不露锋芒。","money":"防损失，保守为宜。","love":"少争执，包容对方难处。","health":"注意情绪与视力。"}},{"n":37,"name":"家人","full":"风火家人","u":"䷤","up":"巽","lo":"离","bits":"101011","gua":"利女贞。","tuan":"家人，女正位乎内，男正位乎外。男女正，天地之大义也。家人有严君焉，父母之谓也。父父，子子，兄兄，弟弟，夫夫，妇妇，而家道正。正家而天下定矣。","dx":"风自火出，家人。君子以言有物而行有恒。","lines":[["初九","闲有家，悔亡。","“闲有家”，志未变也。"],["六二","无攸遂，在中馈，贞吉。","六二之吉，顺以巽也。"],["九三","家人嗃嗃，悔厉吉；妇子嘻嘻，终吝。","“家人嗃嗃”，未失也。“妇子嘻嘻”，失家节也。"],["六四","富家，大吉。","“富家大吉”，顺在位也。"],["九五","王假有家，勿恤，吉。","“王假有家”，交相爱也。"],["上九","有孚威如，终吉。","威如之吉，反身之谓也。"]],"bh":{"key":"家和万事兴","all":"重视家庭与内部秩序，各尽其责，家和则事顺。","job":"内部团结，分工明确。","money":"家庭理财有序。","love":"家庭和睦，适合成家。","health":"家中安康，多陪家人。"}},{"n":38,"name":"睽","full":"火泽睽","u":"䷥","up":"离","lo":"兑","bits":"110101","gua":"小事吉。","tuan":"睽，火动而上，泽动而下。二女同居，其志不同行。说而丽乎明，柔进而上行，得中而应乎刚，是以小事吉。天地睽而其事同也。男女睽而其志通也。万物睽而其事类也，睽之时用大矣哉！","dx":"上火下泽，睽。君子以同而异。","lines":[["初九","悔亡。丧马勿逐自复。见恶人无咎。","“见恶人”，以辟咎也。"],["九二","遇主于巷，无咎。","“遇主于巷”，未失道也。"],["六三","见舆曳，其牛掣，其人天且劓，无初有终。","“见舆曳”，位不当也。“无初有终”，遇刚也。"],["九四","睽孤遇元夫，交孚，厉，无咎。","“交孚无咎”，志行也。"],["六五","悔亡。厥宗噬肤，往何咎？","“厥宗噬肤”，往有庆也。"],["上九","睽孤见豕负涂，载鬼一车，先张之弧，后说之弧，匪寇，婚媾。往遇雨则吉。","“遇雨之吉”，群疑亡也。"]],"bh":{"key":"同中有异","all":"意见分歧多，求同存异，小事可成，大事缓办。","job":"协调分歧，从小事做起。","money":"小财可求，大投资缓行。","love":"易有误会，多沟通。","health":"注意心情烦闷。"}},{"n":39,"name":"蹇","full":"水山蹇","u":"䷦","up":"坎","lo":"艮","bits":"001010","gua":"利西南，不利东北。利见大人。贞吉。","tuan":"蹇，难也，险在前也。见险而能止，知矣哉！蹇，“利西南”，往得中也。“不利东北”，其道穷也。“利见大人”，往有功也。当位“贞吉”，以正邦也。蹇之时用大矣哉！","dx":"山上有水，蹇。君子以反身修德。","lines":[["初六","往蹇来誉。","“往蹇来誉”，宜待也。"],["六二","王臣蹇蹇，匪躬之故。","“王臣蹇蹇”，终无尤也。"],["九三","往蹇来反。","“往蹇来反”，内喜之也。"],["六四","往蹇来连。","“往蹇来连”，当位实也。"],["九五","大蹇朋来。","“大蹇朋来”，以中节也。"],["上六","往蹇来硕，吉，利见大人。","“往蹇来硕”，志在内也。“利见大人”，以从贵也。"]],"bh":{"key":"艰难险阻","all":"前路有阻，宜停下反省、寻求帮助，不宜硬闯。","job":"遇难先停，找贵人协助。","money":"财路受阻，谨慎保守。","love":"多一些理解，共克时艰。","health":"注意腿脚与关节。"}},{"n":40,"name":"解","full":"雷水解","u":"䷧","up":"震","lo":"坎","bits":"010100","gua":"利西南。无所往，其来复吉。有攸往，夙吉。","tuan":"解，险以动，动而免乎险，解。“解，利西南”，往得众也。“其来复吉”，乃得中也。“有攸往，夙吉”，往有功也。天地解而雷雨作，雷雨作而百果草木皆甲坼。解之时大矣哉！","dx":"雷雨作，解。君子以赦过宥罪。","lines":[["初六","无咎。","刚柔之际，义无咎也。"],["九二","田获三狐，得黄矢，贞吉。","九二贞吉，得中道也。"],["六三","负且乘，致寇至，贞吝。","“负且乘”，亦可丑也。自我致戎，又谁咎也？"],["九四","解而拇，朋至斯孚。","“解而拇”，未当位也。"],["六五","君子维有解，吉，有孚于小人。","君子有解，小人退也。"],["上六","公用射隼于高墉之上，获之，无不利。","“公用射隼”，以解悖也。"]],"bh":{"key":"困难解除","all":"难题逐渐化解，宜早处理、放下过去，轻装前进。","job":"问题解决，可推进事务。","money":"财务压力缓解。","love":"心结打开，关系缓和。","health":"病况好转。"}},{"n":41,"name":"损","full":"山泽损","u":"䷨","up":"艮","lo":"兑","bits":"110001","gua":"有孚，元吉，无咎。可贞，利有攸往。曷之用？二簋可用享。","tuan":"损，损下益上，其道上行。损而有孚，元吉，无咎，可贞，利有攸往，曷之用？二簋可用享。二簋应有时。损刚益柔有时，损益盈虚，与时偕行。","dx":"山下有泽，损。君子以惩忿窒欲。","lines":[["初九","已事遄往，无咎。酌损之。","“已事遄往”，尚合志也。"],["九二","利贞。征凶，弗损，益之。","“九二利贞”，中以为志也。"],["六三","三人行则损一人，一人行则得其友。","“一人行”，“三”则疑也。"],["六四","损其疾，使遄有喜，无咎。","“损其疾”，亦可喜也。"],["六五","或益之十朋之龟，弗克违，元吉。","六五元吉，自上祐也。"],["上九","弗损，益之，无咎，贞吉，利有攸往，得臣无家。","“弗损，益之”，大得志也。"]],"bh":{"key":"先损后益","all":"有舍才有得，减少欲望和支出，反而带来收益。","job":"舍小利、顾大局。","money":"控制支出，以后见利。","love":"多付出少计较，感情更深。","health":"减少不良嗜好，身体受益。"}},{"n":42,"name":"益","full":"风雷益","u":"䷩","up":"巽","lo":"震","bits":"100011","gua":"利有攸往。利涉大川。","tuan":"“益”，损上益下，民说无疆。自上下下，其道大光。“利有攸往”，中正有庆。“利涉大川”，木道乃行。益动而巽，日进无疆。天施地生，其益无方。凡益之道，与时偕行。","dx":"风雷，益。君子以见善则迁，有过则改。","lines":[["初九","利用为大作，元吉，无咎。","“元吉无咎”，下不厚事也。"],["六二","或益之十朋之龟，弗克违。永贞吉。王用享于帝，吉。","“或益之”，自外来也。"],["六三","益之用凶事，无咎。有孚。中行告公用圭。","“益用凶事”，固有之也。"],["六四","中行告公，从，利用为依迁国。","“告公从”，以益志也。"],["九五","有孚惠心，勿问，元吉。有孚，惠我德。","“有孚惠心”，勿问之矣。“惠我德”，大得志也。"],["上九","莫益之，或击之，立心勿恒，凶。","“莫益之”，偏辞也。“或击之”，自外来也。"]],"bh":{"key":"增益发展","all":"有助力、有收获，宜行善助人、积极进取。","job":"发展顺利，宜扩张、进修。","money":"财运增长。","love":"感情升温，互相成就。","health":"身体向好。"}},{"n":43,"name":"夬","full":"泽天夬","u":"䷪","up":"兑","lo":"乾","bits":"111110","gua":"扬于王庭，孚号。有厉，告自邑。不利即戎，利有攸往。","tuan":"“夬”，决也，刚决柔也。健而说，决而和。“扬于王庭”，柔乘五刚也。“孚号有厉”，其危乃光也。“告自邑，不利即戎”，所尚乃穷也。“利有攸往”，刚长乃终也。","dx":"泽上于天，夬。君子以施禄及下，居德则忌。","lines":[["初九","壮于前趾，往不胜，为咎。","不胜而往，咎也。"],["九二","惕号，莫夜有戎，勿恤。","“有戎勿恤”，得中道也。"],["九三","壮于頄，有凶。君子夬夬独行，遇雨若濡，有愠无咎。","“君子夬夬”，终无咎也。"],["九四","臀无肤，其行次且。牵羊悔亡，闻言不信。","“其行次且”，位不当也。“闻言不信”，聪不明也。"],["九五","苋陆夬夬中行，无咎。","“中行无咎”，中未光也。"],["上六","无号，终有凶。","“无号之凶”，终不可长也。"]],"bh":{"key":"果断决断","all":"需要果断清除问题，但要讲方式，不可蛮干。","job":"下决心解决问题，公开透明。","money":"及时止损。","love":"该说清楚就说清楚，温和而坚定。","health":"防急躁上火。"}},{"n":44,"name":"姤","full":"天风姤","u":"䷫","up":"乾","lo":"巽","bits":"011111","gua":"女壮，勿用取女。","tuan":"姤，遇也，柔遇刚也。“勿用取女”，不可与长也。天地相遇，品物咸章也。刚遇中正，天下大行也。姤之时义大矣哉！","dx":"天下有风，姤。后以施命诰四方。","lines":[["初六","系于金柅，贞吉。有攸往，见凶，羸豕孚蹢躅。","“系于金柅”，柔道牵也。"],["九二","包有鱼，无咎，不利宾。","“包有鱼”，义不及宾也。"],["九三","臀无肤，其行次且，厉，无大咎。","“其行次且”，行未牵也。"],["九四","包无鱼，起凶。","“无鱼之凶”，远民也。"],["九五","以杞包瓜，含章，有陨自天。","九五含章，中正也。有陨自天，志不舍命也。"],["上九","姤其角，吝，无咎。","“姤其角”，上穷吝也。"]],"bh":{"key":"不期而遇","all":"易有意外相遇，要明辨好坏，别被小诱惑带偏。","job":"新机会出现，先辨真伪。","money":"防诱惑性投资。","love":"易遇桃花，慎重选择。","health":"注意节制。"}},{"n":45,"name":"萃","full":"泽地萃","u":"䷬","up":"兑","lo":"坤","bits":"000110","gua":"亨，王假有庙。利见大人。亨，利贞，用大牲吉。利有攸往。","tuan":"“萃”，聚也。顺以说，刚中而应，故聚也。“王假有庙”，致孝享也。“利见大人亨”，聚以正也。“用大牲吉，利有攸往”，顺天命也。观其所聚，而天地万物之情可见矣。","dx":"泽上于地，萃。君子以除戎器，戒不虞。","lines":[["初六","有孚不终，乃乱乃萃，若号，一握为笑，勿恤，往无咎。","“乃乱乃萃”，其志乱也。"],["六二","引吉，无咎，孚乃利用禴。","“引吉无咎”，中未变也。"],["六三","萃如嗟如，无攸利，往无咎，小吝。","“往无咎”，上巽也。"],["九四","大吉无咎。","“大吉无咎”，位不当也。"],["九五","萃有位，无咎。匪孚，元永贞，悔亡。","“萃有位”，志未光也。"],["上六","赍咨涕洟，无咎。","“赍咨涕洟”，未安上也。"]],"bh":{"key":"荟萃聚合","all":"人气聚集，团结一致，适合聚会、合作与大事。","job":"团队凝聚，宜开会集思广益。","money":"聚财之象，合作得利。","love":"感情和合，适合见家人。","health":"人多处注意防病。"}},{"n":46,"name":"升","full":"地风升","u":"䷭","up":"坤","lo":"巽","bits":"011000","gua":"元亨。用见大人，勿恤。南征吉。","tuan":"柔以时升，巽而顺，刚中而应，是以大亨，“用见大人勿恤”，有庆也。“南征吉”，志行也。","dx":"地中生木，升。君子以顺德，积小以高大。","lines":[["初六","允升，大吉。","“允升大吉”，上合志也。"],["九二","孚乃利用禴，无咎。","九二之孚，有喜也。"],["九三","升虚邑。","“升虚邑”，无所疑也。"],["六四","王用亨于岐山，吉，无咎。","“王用亨于岐山”，顺事也。"],["六五","贞吉，升阶。","“贞吉升阶”，大得志也。"],["上六","冥升，利于不息之贞。","冥升在上，消不富也。"]],"bh":{"key":"步步上升","all":"循序渐进、稳步上升，往高处发展有利。","job":"升迁发展，稳步向前。","money":"收入稳步增加。","love":"感情渐入佳境。","health":"稳健锻炼，体能提升。"}},{"n":47,"name":"困","full":"泽水困","u":"䷮","up":"兑","lo":"坎","bits":"010110","gua":"亨。贞大人吉，无咎。有言不信。","tuan":"“困”，刚揜也。险以说，困而不失其所，亨，其唯君子乎。“贞大人吉”，以刚中也。“有言不信”，尚口乃穷也。","dx":"泽无水，困。君子以致命遂志。","lines":[["初六","臀困于株木，入于幽谷，三岁不觌。","“入于幽谷”，幽不明也。"],["九二","困于酒食，朱绂方来。利用享祀。征凶，无咎。","“困于酒食”，中有庆也。"],["六三","困于石，据于蒺藜，入于其宫，不见其妻，凶。","“据于蒺藜”，乘刚也。“入于其宫，不见其妻”，不祥也。"],["九四","来徐徐，困于金车，吝，有终。","“来徐徐”，志在下也。虽不当位，有与也。"],["九五","劓刖，困于赤绂，乃徐有说，利用祭祀。","“劓刖”，志未得也。“乃徐有说”，以中直也。“利用祭祀”，受福也。"],["上六","困于葛藟，于臲卼，曰动悔有悔，征吉。","“困于葛藟”，未当也。“动悔有悔”，吉行也。"]],"bh":{"key":"困顿受限","all":"处境困难，言语难被理解，宜坚守信念、少说多做。","job":"困局中守住本分，等待转机。","money":"手头紧，节省开支。","love":"多体谅对方压力。","health":"注意疲惫与情绪。"}},{"n":48,"name":"井","full":"水风井","u":"䷯","up":"坎","lo":"巽","bits":"011010","gua":"改邑不改井，无丧无得。往来井井。汔至，亦未繘井，羸其瓶，凶。","tuan":"巽乎水而上水，井。井养而不穷也。“改邑不改井，”乃以刚中也。“汔至，亦未繘井”，未有功也。“羸其瓶”，是以凶也。","dx":"木上有水，井。君子以劳民劝相。","lines":[["初六","井泥不食。旧井无禽。","“井泥不食”，下也。“旧井无禽”，时舍也。"],["九二","井谷射鲋，瓮敝漏。","“井谷射鲋”，无与也。"],["九三","井渫不食，为我心恻。可用汲，王明并受其福。","“井渫不食”，行恻也。求“王明”，受福也。"],["六四","井甃，无咎。","“井甃无咎”，修井也。"],["九五","井洌，寒泉食。","“寒泉之食”，中正也。"],["上六","井收勿幕，有孚元吉。","“元吉”在“上”，大成也。"]],"bh":{"key":"井养不穷","all":"像水井一样稳定供养，宜修身充实，服务他人。","job":"稳定岗位，持续提升自己。","money":"细水长流。","love":"平淡中见真情。","health":"注意饮水与肠胃。"}},{"n":49,"name":"革","full":"泽火革","u":"䷰","up":"兑","lo":"离","bits":"101110","gua":"已日乃孚。元亨。利贞，悔亡。","tuan":"革，水火相息，二女同居，其志不相得曰革。“已日乃孚”，革而信之。文明以说，大亨以正。革而当，其悔乃亡。天地革而四时成，汤武革命，顺乎天而应乎人。革之时大矣哉！","dx":"泽中有火，革。君子以治历明时。","lines":[["初九","巩用黄牛之革。","“巩用黄牛”，不可以有为也。"],["六二","已日乃革之，征吉，无咎。","“巳日革之”，行有嘉也。"],["九三","征凶。贞厉。革言三就，有孚。","“革言三就”，又何之矣。"],["九四","悔亡。有孚改命，吉。","“改命之吉”，信志也。"],["九五","大人虎变，未占有孚。","“大人虎变”，其文炳也。"],["上六","君子豹变，小人革面，征凶，居贞吉。","“君子豹变”，其文蔚也。“小人革面”，顺以从君也。"]],"bh":{"key":"变革更新","all":"到了改变的时候，时机成熟再变，变则通。","job":"适合转型、改革，赢得信任后行动。","money":"调整投资结构。","love":"关系面临改变，坦诚沟通。","health":"改掉坏习惯的好时机。"}},{"n":50,"name":"鼎","full":"火风鼎","u":"䷱","up":"离","lo":"巽","bits":"011101","gua":"元吉，亨。","tuan":"鼎，象也。以木巽火，亨饪也。圣人亨以享上帝，而大亨以养圣贤。巽而耳目聪明，柔进而上行，得中而应乎刚，是以元亨。","dx":"木上有火，鼎。君子以正位凝命。","lines":[["初六","鼎颠趾，利出否。得妾以其子，无咎。","“鼎颠趾”，未悖也。“利出否”，以从贵也。"],["九二","鼎有实，我仇有疾，不我能即，吉。","“鼎有实”，慎所之也。“我仇有疾”，终无尤也。"],["九三","鼎耳革，其行塞，雉膏不食，方雨，亏悔，终吉。","“鼎耳革”，失其义也。"],["九四","鼎折足，覆公餗，其形渥，凶。","“覆公餗”，信如何也。"],["六五","鼎黄耳金铉，利贞。","“鼎黄耳”，中以为实也。"],["上九","鼎玉铉，大吉，无不利。","玉铉在上，刚柔节也。"]],"bh":{"key":"鼎新稳固","all":"除旧布新，确立新秩序，稳重而有成。","job":"新职位、新项目可成，得到重用。","money":"财运稳定上升。","love":"关系稳固，适合定下来。","health":"注意饮食调养。"}},{"n":51,"name":"震","full":"震为雷","u":"䷲","up":"震","lo":"震","bits":"100100","gua":"亨。震来虩虩，笑言哑哑，震惊百里，不丧匕鬯。","tuan":"震，亨。“震来虩虩”，恐致福也。“笑言哑哑”，后有则也。“震惊百里”，惊远而惧迩也。“不丧匕鬯”，出可以守宗庙社稷，以为祭主也。","dx":"洊雷，震。君子以恐惧修省。","lines":[["初九","震来虩虩，后笑言哑哑，吉。","“震来虩虩”，恐致福也。“笑言哑哑”，后有则也。"],["六二","震来厉，亿丧贝，跻于九陵，勿逐，七日得。","“震来厉”，乘刚也。"],["六三","震苏苏，震行无眚。","“震苏苏”，位不当也。"],["九四","震遂泥。","“震遂泥”，未光也。"],["六五","震往来，厉，亿无丧，有事。","“震往来厉”，危行也。其事在中，大无丧也。"],["上六","震索索，视矍矍，征凶。震不于其躬，于其邻，无咎。婚媾有言。","“震索索”，中未得也。虽凶无咎，畏邻戒也。"]],"bh":{"key":"震动警醒","all":"突发变动令人一惊，保持镇定、警惕反省，终能平安。","job":"有变动，冷静应对反成机会。","money":"防意外支出。","love":"有波折，冷静就好。","health":"注意受惊与肝气。"}},{"n":52,"name":"艮","full":"艮为山","u":"䷳","up":"艮","lo":"艮","bits":"001001","gua":"艮其背，不获其身，行其庭，不见其人，无咎。","tuan":"艮，止也。时止则止，时行则行，动静不失其时，其道光明。“艮其止”，止其所也。上下敌应，不相与也。是以“不获其身，行其庭，不见其人，无咎”也。","dx":"兼山，艮。君子以思不出其位。","lines":[["初六","艮其趾，无咎。利永贞。","“艮其趾”，未失正也。"],["六二","艮其腓，不拯其随，其心不快。","“不拯其随”，未退听也。"],["九三","艮其限，列其夤，厉，薰心。","“艮其限”，危薰心也。"],["六四","艮其身，无咎。","“艮其身”，止诸躬也。"],["六五","艮其辅，言有序，悔亡。","“艮其辅”，以中正也。"],["上九","敦艮，吉。","“敦艮之吉”，以厚终也。"]],"bh":{"key":"适可而止","all":"该停就停，知止而后安，静下心来思考。","job":"暂停冒进，稳住现状。","money":"守财为主。","love":"给彼此冷静空间。","health":"多休息，宜静养。"}},{"n":53,"name":"渐","full":"风山渐","u":"䷴","up":"巽","lo":"艮","bits":"001011","gua":"女归吉，利贞。","tuan":"渐之进也，女归吉也。进得位，往有功也。进以正，可以正邦也。其位刚得中也。止而巽，动不穷也。","dx":"山上有木，渐。君子以居贤德善俗。","lines":[["初六","鸿渐于干。小子厉，有言，无咎。","“小子之厉”，义无咎也。"],["六二","鸿渐于磐，饮食衎衎，吉。","“饮食衎衎”，不素饱也。"],["九三","鸿渐于陆。夫征不复，妇孕不育，凶。利御寇。","“夫征不复”，离群丑也。“妇孕不育”，失其道也。“利用御寇”，顺相保也。"],["六四","鸿渐于木，或得其桷，无咎。","“或得其桷”，顺以巽也。"],["九五","鸿渐于陵，妇三岁不孕，终莫之胜，吉。","“终莫之胜吉”，得所愿也。"],["上九","鸿渐于陆，其羽可用为仪，吉。","“其羽可用为仪，吉”，不可乱也。"]],"bh":{"key":"循序渐进","all":"像鸿雁一样慢慢前进，按部就班，好事会来。","job":"逐步发展，稳定提升。","money":"财运缓慢增长。","love":"感情循序渐进，婚嫁吉。","health":"身体稳定。"}},{"n":54,"name":"归妹","full":"雷泽归妹","u":"䷵","up":"震","lo":"兑","bits":"110100","gua":"征凶，无攸利。","tuan":"归妹，天地之大义也。天地不交而万物不兴。归妹，人之终始也。说以动，所归妹也。“征凶”，位不当也。“无攸利”，柔乘刚也。","dx":"泽上有雷，归妹。君子以永终知敝。","lines":[["初九","归妹以娣。跛能履，征吉。","“归妹以娣”，以恒也。“跛能履吉”，相承也。"],["九二","眇能视，利幽人之贞。","“利幽人之贞”，未变常也。"],["六三","归妹以须，反归以娣。","“归妹以须”，未当也。"],["九四","归妹愆期，迟归有时。","“愆期”之志，有待而行也。"],["六五","帝乙归妹，其君之袂不如其娣之袂良。月几望，吉。","“帝乙归妹，不如其娣之袂良”也。其位在中，以贵行也。"],["上六","女承筐无实，士刲羊无血，无攸利。","上六无实，承虚筐也。"]],"bh":{"key":"名分不正","all":"开始的身份或条件不太理想，宜谨慎守本分，别急进。","job":"注意角色定位，不越权。","money":"防冲动决策。","love":"感情需看清，不要仓促。","health":"注意情绪波动。"}},{"n":55,"name":"丰","full":"雷火丰","u":"䷶","up":"震","lo":"离","bits":"101100","gua":"亨，王假之。勿忧，宜日中。","tuan":"丰，大也。明以动，故丰。“王假之”，尚大也。“勿忧宜日中”，宜照天下也。日中则昃，月盈则食，天地盈虚，与时消息，而况于人乎，况于鬼神乎？","dx":"雷电皆至，丰。君子以折狱致刑。","lines":[["初九","遇其配主，虽旬无咎，往有尚。","“虽旬无咎”，过旬灾也。"],["六二","丰其蔀，日中见斗。往得疑疾，有孚发若，吉。","“有孚发若”，信以发志也。"],["九三","丰其沛，日中见沬，折其右肱，无咎。","“丰其沛”，不可大事也。“折其右肱”，终不可用也。"],["九四","丰其蔀，日中见斗，遇其夷主，吉。","“丰其蔀”，位不当也。“日中见斗”，幽不明也。“遇其夷主”，吉行也。"],["六五","来章有庆誉，吉。","六五之吉，有庆也。"],["上六","丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。","“丰其屋”，天际翔也。“窥其户，阒其无人”，自藏也。"]],"bh":{"key":"丰盛盛大","all":"事业达到高峰，宜把握当下，也要预防盛极而衰。","job":"成就显著，宜乘势而为。","money":"财运丰盛，防过度扩张。","love":"感情热烈，珍惜当下。","health":"防过度劳累。"}},{"n":56,"name":"旅","full":"火山旅","u":"䷷","up":"离","lo":"艮","bits":"001101","gua":"小亨。旅贞吉。","tuan":"“旅小亨”，柔得中乎外，而顺乎刚，止而丽乎明，是以“小亨旅贞吉”也。旅之时义大矣哉！","dx":"山上有火，旅。君子以明慎用刑而不留狱。","lines":[["初六","旅琐琐，斯其所取灾。","“旅琐琐”，志穷灾也。"],["六二","旅即次，怀其资，得童仆，贞。","“得童仆贞”，终无尤也。"],["九三","旅焚其次，丧其童仆，贞厉。","“旅焚其次”，亦以伤矣。以旅与下，其义丧也。"],["九四","旅于处，得其资斧，我心不快。","“旅于处”，未得位也。“得其资斧”，心未快也。"],["六五","射雉，一矢亡，终以誉命。","“终以誉命”，上逮也。"],["上九","鸟焚其巢，旅人先笑后号咷。丧牛于易，凶。","以旅在上，其义焚也。“丧牛于易”，终莫之闻也。"]],"bh":{"key":"羁旅漂泊","all":"在外奔波、处境不稳，谦虚谨慎、守正则安。","job":"出差、变动多，低调做事。","money":"小财可得，防遗失。","love":"聚少离多，多联系。","health":"旅途注意安全与饮食。"}},{"n":57,"name":"巽","full":"巽为风","u":"䷸","up":"巽","lo":"巽","bits":"011011","gua":"小亨。利有攸往。利见大人。","tuan":"重巽以申命。刚巽乎中正而志行。柔皆顺乎刚，是以“小亨，利有攸往，利见大人”。","dx":"随风，巽。君子以申命行事。","lines":[["初六","进退，利武人之贞。","“进退”，志疑也。“利武人之贞”，志治也。"],["九二","巽在床下，用史巫纷若，吉，无咎。","“纷若之吉”，得中也。"],["九三","频巽，吝。","“频巽之吝”，志穷也。"],["六四","悔亡，田获三品。","“田获三品”，有功也。"],["九五","贞吉，悔亡，无不利，无初有终。先庚三日，后庚三日，吉。","九五之吉，位正中也。"],["上九","巽在床下，丧其资斧，贞凶。","“巽在床下”，上穷也。“丧其资斧”，正乎凶也。"]],"bh":{"key":"谦逊顺入","all":"柔顺渗透，宜跟随贤者、细水长流地推进。","job":"多沟通、听取建议，循序推进。","money":"小财稳进。","love":"温和体贴最得人心。","health":"注意呼吸道。"}},{"n":58,"name":"兑","full":"兑为泽","u":"䷹","up":"兑","lo":"兑","bits":"110110","gua":"亨。利贞。","tuan":"兑，说也。刚中而柔外，说以利贞，是以顺乎天而应乎人。说以先民，民忘其劳。说以犯难，民忘其死。说之大，民劝矣哉！","dx":"丽泽，兑。君子以朋友讲习。","lines":[["初九","和兑，吉。","“和兑之吉”，行未疑也。"],["九二","孚兑，吉，悔亡。","“孚兑之吉”，信志也。"],["六三","来兑，凶。","“来兑之凶”，位不当也。"],["九四","商兑未宁，介疾有喜。","“九四之喜”，有庆也。"],["九五","孚于剥，有厉。","“孚于剥”，位正当也。"],["上六","引兑。","上六“引兑”，未光也。"]],"bh":{"key":"喜悦和乐","all":"心情愉快，人缘好，以诚待人则更顺。","job":"沟通协作愉快，宜合作。","money":"财运平顺。","love":"感情甜蜜。","health":"心情愉快，防口舌之争。"}},{"n":59,"name":"涣","full":"风水涣","u":"䷺","up":"巽","lo":"坎","bits":"010011","gua":"亨。王假有庙。利涉大川，利贞。","tuan":"“涣，亨”，刚来而不穷，柔得位乎外而上同。“王假有庙”，王乃在中也。“利涉大川”，乘木有功也。","dx":"风行水上，涣。先王以享于帝，立庙。","lines":[["初六","用拯马壮，吉。","初六之吉顺也。"],["九二","涣奔其机，悔亡。","“涣奔其机”，得愿也。"],["六三","涣其躬，无悔。","“涣其躬”，志在外也。"],["六四","涣其群，元吉。涣有丘，匪夷所思。","“涣其群元吉”，光大也。"],["九五","涣汗其大号，涣王居，无咎。","“王居无咎”，正位也。"],["上九","涣其血，去逖出，无咎。","“涣其血”，远害也。"]],"bh":{"key":"涣散化解","all":"人心或事情易散，需要凝聚人心、化解隔阂。","job":"整合资源，重建团队。","money":"防钱财流失。","love":"多陪伴，化解隔阂。","health":"注意受寒与情绪。"}},{"n":60,"name":"节","full":"水泽节","u":"䷻","up":"坎","lo":"兑","bits":"110010","gua":"亨。苦节，不可贞。","tuan":"“节亨”。刚柔分而刚得中。“苦节不可贞”，其道穷也。说以行险，当位以节，中正以通。天地节而四时成。节以制度，不伤财，不害民。","dx":"泽上有水，节。君子以制数度，议德行。","lines":[["初九","不出户庭，无咎。","“不出户庭”，知通塞也。"],["九二","不出门庭，凶。","“不出门庭凶”，失时极也。"],["六三","不节若，则嗟若，无咎。","“不节之嗟”，又谁咎也。"],["六四","安节。亨。","“安节之亨”，承上道也。"],["九五","甘节，吉，往有尚。","“甘节之吉”，居位中也。"],["上六","苦节，贞凶，悔亡。","“苦节贞凶”，其道穷也。"]],"bh":{"key":"节制有度","all":"凡事有节度最好，但也别过分苛刻自己。","job":"定好规矩和计划。","money":"节约理财，量入为出。","love":"给彼此恰当的空间。","health":"饮食有节，作息有度。"}},{"n":61,"name":"中孚","full":"风泽中孚","u":"䷼","up":"巽","lo":"兑","bits":"110011","gua":"豚鱼，吉。利涉大川，利贞。","tuan":"“中孚”，柔在内而刚得中，说而巽，孚乃化邦也。“豚鱼吉”，信及豚鱼也。“利涉大川”，乘木舟虚也。中孚以利贞，乃应乎天也。","dx":"泽上有风，中孚。君子以议狱缓死。","lines":[["初九","虞吉，有它不燕。","初九“虞吉”，志未变也。"],["九二","鸣鹤在阴，其子和之。我有好爵，吾与尔靡之。","“其子和之”，中心愿也。"],["六三","得敌，或鼓或罢，或泣或歌。","“或鼓或罢”，位不当也。"],["六四","月几望，马匹亡，无咎。","“马匹亡”，绝类上也。"],["九五","有孚挛如，无咎。","“有孚挛如”，位正当也。"],["上九","翰音登于天，贞凶。","“翰音登于天”，何可长也？"]],"bh":{"key":"诚信感人","all":"以诚信待人，就能感动人心、渡过难关。","job":"诚信做事，得人信任。","money":"讲信用，财运稳。","love":"真诚相待，感情深厚。","health":"心态平和。"}},{"n":62,"name":"小过","full":"雷山小过","u":"䷽","up":"震","lo":"艮","bits":"001100","gua":"亨。利贞。可小事，不可大事。飞鸟遗之音，不宜上，宜下，大吉。","tuan":"小过，小者过而亨也。过以利贞，与时行也。柔得中，是以小事吉也。刚失位而不中，是以不可大事也。有飞鸟之象焉，“飞鸟遗之音，不宜上，宜下，大吉”，上逆而下顺也。","dx":"山上有雷，小过。君子以行过乎恭，丧过乎哀，用过乎俭。","lines":[["初六","飞鸟以凶。","“飞鸟以凶”，不可如何也。"],["六二","过其祖，遇其妣。不及其君，遇其臣。无咎。","“不及其君”，臣不可过也。"],["九三","弗过防之，从或戕之，凶。","“从或戕之”，凶如何也？"],["九四","无咎。弗过遇之，往厉必戒，勿用永贞。","“弗过遇之”，位不当也。“往厉必戒”，终不可长也。"],["六五","密云不雨，自我西郊。公弋取彼在穴。","“密云不雨”，已上也。"],["上六","弗遇过之，飞鸟离之，凶，是谓灾眚。","“弗遇过之”，已亢也。"]],"bh":{"key":"小有过度","all":"宜小事不宜大事，低调谨慎，宁下不上。","job":"做好小事，不宜冒进。","money":"小额可做，大额谨慎。","love":"多些体谅，少些要求。","health":"注意小病小痛。"}},{"n":63,"name":"既济","full":"水火既济","u":"䷾","up":"坎","lo":"离","bits":"101010","gua":"亨小，利贞。初吉终乱。","tuan":"“既济，亨”，小者亨也。“利贞”。刚柔正而位当也。“初吉”，柔得中也。“终止则乱”，其道穷也。","dx":"水在火上，既济。君子以思患而豫防之。","lines":[["初九","曳其轮，濡其尾，无咎。","“曳其轮”，义无咎也。"],["六二","妇丧其茀，勿逐，七日得。","“七日得”，以中道也。"],["九三","高宗伐鬼方，三年克之，小人勿用。","“三年克之”，惫也。"],["六四","繻有衣袽，终日戒。","“终日戒”，有所疑也。"],["九五","东邻杀牛，不如西邻之禴祭，实受其福。","“东邻杀牛”，不如西邻之时也。“实受其福”，吉大来也。"],["上六","濡其首，厉。","“濡其首厉”，何可久也？"]],"bh":{"key":"功成守成","all":"事情已经办成，开始顺利但要防后乱，守成更难。","job":"守住成果，防松懈。","money":"保住已有收益。","love":"关系已稳，用心维护。","health":"保持好习惯。"}},{"n":64,"name":"未济","full":"火水未济","u":"䷿","up":"离","lo":"坎","bits":"010101","gua":"亨。小狐汔济，濡其尾，无攸利。","tuan":"“未济，亨”，柔得中也。“小狐汔济”，未出中也。“濡其尾，无攸利”，不续终也。虽不当位，刚柔应也。","dx":"火在水上，未济。君子以慎辨物居方。","lines":[["初六","濡其尾，吝。","“濡其尾”，亦不知极也。"],["九二","曳其轮，贞吉。","九二贞吉，中以行正也。"],["六三","未济，征凶。利涉大川。","“未济征凶”，位不当也。"],["九四","贞吉，悔亡，震用伐鬼方，三年，有赏于大国。","“贞吉悔亡”，志行也。"],["六五","贞吉，无悔。君子之光，有孚吉。","“君子之光”，其晖吉也。"],["上九","有孚于饮酒，无咎。濡其首，有孚失是。","“饮酒濡首”，亦不知节也。"]],"bh":{"key":"未完待续","all":"事情还没完成，前景可期，谨慎踏实就能成功。","job":"还需努力，坚持到底。","money":"财运有望，耐心经营。","love":"感情未定，继续用心。","health":"逐步调理，渐好。"}}];
const TRI={'乾':['天','☰'],'坤':['地','☷'],'震':['雷','☳'],'巽':['风','☴'],'坎':['水','☵'],'离':['火','☲'],'艮':['山','☶'],'兑':['泽','☱']};
const BY_BITS={};G.forEach(h=>BY_BITS[h.bits]=h);

const VNAME={6:'老阴',7:'少阳',8:'少阴',9:'老阳'};

// ---- coins ----
function coinHTML(){return '<div class="coin"><div class="f front"><span>乾</span><span>隆</span><span>通</span><span>宝</span></div><div class="f back"></div></div>';}
$('#coins').innerHTML=coinHTML()+coinHTML()+coinHTML();
function rnd2(n){const a=new Uint32Array(n);crypto.getRandomValues(a);return Array.from(a,x=>x&1);}

let vals=[],busy=false;
function lineHTML(v,i,cls){const yang=(v===7||v===9),chg=(v===6||v===9);
  return `<div class="yao ${cls||''}"><span class="lab">${POS[i]}爻 ${VNAME[v]}</span><div class="bar ${yang?'yang':'yin'} ${chg?'chg':''}">${yang?'<i></i>':'<i></i><i></i>'}</div><span class="mk">${v===9?'○':v===6?'×':''}</span></div>`;}
function renderBuild(){ $('#build').innerHTML=vals.map((v,i)=>lineHTML(v,i,i===vals.length-1?'new':'')).join('');
  $('#tossBtn').textContent=vals.length<6?`摇卦（${vals.length+1}/6）`:'起卦完成';
  $('#tossBtn').disabled=vals.length>=6; $('#resetBtn').classList.toggle('hidden',vals.length===0);}
$('#tossBtn').onclick=()=>{ if(busy||vals.length>=6)return; busy=true;
  // three-coin method: 字(正)=3, 背=2 ; sum 6/7/8/9
  const faces=rnd2(3); const sum=faces.reduce((s,f)=>s+(f?3:2),0);
  const cs=document.querySelectorAll('.coin');
  cs.forEach((c,i)=>{c.classList.remove('spin');c.style.transform='';void c.offsetWidth;c.classList.add('spin');});
  setTimeout(()=>{cs.forEach((c,i)=>{c.classList.remove('spin');c.style.transform=faces[i]?'rotateY(0deg)':'rotateY(180deg)';});
    vals.push(sum);
    $('#tosslog').textContent=`第${vals.length}次：${faces.map(f=>f?'字':'背').join(' ')} → ${sum}（${VNAME[sum]}${sum===6||sum===9?'，动爻':''}）`;
    renderBuild(); busy=false;
    if(vals.length===6){const r={t:Date.now(),q:$('#q').value.trim(),v:vals.slice()};saveHist(r);setTimeout(()=>showResult(r,true),450);}
  },900);
};
$('#resetBtn').onclick=()=>{vals=[];renderBuild();$('#tosslog').textContent='尚未起卦';$('#result').innerHTML='';window.scrollTo({top:0,behavior:'smooth'});};

// ---- Zhu Xi rules (《易学启蒙·考变占》) ----
function analyze(v){
  const bits=v.map(x=>(x===7||x===9)?'1':'0').join('');
  const zbits=v.map(x=>(x===9||x===6)?((x===9)?'0':'1'):((x===7)?'1':'0')).join('');
  const ben=BY_BITS[bits], chg=[];v.forEach((x,i)=>{if(x===6||x===9)chg.push(i);});
  const zhi=chg.length?BY_BITS[zbits]:null, still=[0,1,2,3,4,5].filter(i=>!chg.includes(i));
  const n=chg.length, reads=[]; let rule='';
  const Y=(h,i,main)=>reads.push({w:`${h.name}卦 ${h.lines[i][0]}`,t:h.lines[i][1],x:h.lines[i][2],main});
  const C=(h,main,lab)=>reads.push({w:`${h.name}卦 卦辞${lab||''}`,t:h.gua,x:'',main});
  if(n===0){rule='六爻皆不变：占<b>本卦卦辞</b>（并参彖、象）。';C(ben,true);}
  else if(n===1){rule='一爻变：以<b>本卦变爻的爻辞</b>占。';Y(ben,chg[0],true);}
  else if(n===2){rule='二爻变：以<b>本卦两个变爻的爻辞</b>占，<b>以上爻为主</b>。';Y(ben,chg[1],true);Y(ben,chg[0],false);}
  else if(n===3){rule='三爻变：占<b>本卦与之卦的卦辞</b>，<b>以本卦为主</b>（本卦为贞，之卦为悔）。';C(ben,true,'（贞）');C(zhi,false,'（悔）');}
  else if(n===4){rule='四爻变：以<b>之卦两个不变爻的爻辞</b>占，<b>以下爻为主</b>。';Y(zhi,still[0],true);Y(zhi,still[1],false);}
  else if(n===5){rule='五爻变：以<b>之卦那个不变爻的爻辞</b>占。';Y(zhi,still[0],true);}
  else { if(ben.yong){rule=`六爻皆变，且本卦为${ben.name}：占<b>「${ben.yong[0]}」</b>之辞，并参之卦卦辞。`;reads.push({w:`${ben.name}卦 ${ben.yong[0]}`,t:ben.yong[1],x:ben.yong[2],main:true});C(zhi,false);}
         else {rule='六爻皆变：占<b>之卦卦辞</b>。';C(zhi,true);} }
  return {ben,zhi,chg,n,reads,rule,focus:(n>=4&&zhi)?zhi:ben};
}

function miniHex(bits,chg){return '<div class="mini">'+bits.split('').map((b,i)=>`<div class="bar ${b==='1'?'yang':'yin'} ${chg&&chg.includes(i)?'chg':''}">${b==='1'?'<i></i>':'<i></i><i></i>'}</div>`).join('')+'</div>';}
function hexBox(h,tag,b,chg){return `<div class="hexbox"><span class="tag ${b?'b':''}">${tag}</span><div class="nm">${h.name}</div><div class="sub">第${h.n}卦 · ${h.full} ${h.u}</div>${miniHex(h.bits,chg)}<div class="sub">上${h.up}${TRI[h.up][1]}${TRI[h.up][0]} · 下${h.lo}${TRI[h.lo][1]}${TRI[h.lo][0]}</div></div>`;}
function fullText(h,hl){
  let s=`<div class="txt"><p><span class="k">卦辞</span>${h.name}：${esc(h.gua)}</p><p><span class="k">彖曰</span>${esc(h.tuan)}</p><p><span class="k">象曰</span>${esc(h.dx)}</p></div><h3>六爻爻辞（自下而上）</h3>`;
  s+=h.lines.map((l,i)=>`<div class="yl ${hl&&hl.includes(i)?'hl':''}"><b>${l[0]}</b>：${esc(l[1])}<span class="x">象曰：${esc(l[2])}</span></div>`).join('');
  if(h.yong)s+=`<div class="yl"><b>${h.yong[0]}</b>：${esc(h.yong[1])}<span class="x">象曰：${esc(h.yong[2])}</span></div>`;
  return s;}
function bhHTML(h){const b=h.bh;return `<div class="bh"><p class="txt"><b style="color:var(--red)">「${b.key}」</b>${b.all}</p>
 <div class="row"><b>事业</b><span>${b.job}</span></div><div class="row"><b>财运</b><span>${b.money}</span></div><div class="row"><b>感情</b><span>${b.love}</span></div><div class="row"><b>健康</b><span>${b.health}</span></div></div>`;}

function showResult(r,scroll){
  const a=analyze(r.v), d=new Date(r.t);
  const when=d.toLocaleString('zh-CN',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  let h=`<div class="card"><h2>卦象</h2><div class="qshow">${r.q?'所问：'+esc(r.q)+'<br>':''}起卦时间：${when}　·　动爻：${a.n?a.chg.map(i=>POS[i]+'爻').join('、'):'无'}</div>
  <div class="hexrow">${hexBox(a.ben,'本卦',false,a.chg)}${a.zhi?'<div class="arrow">➜</div>'+hexBox(a.zhi,'变卦',true):''}</div>
  <div class="rule"><b>朱熹断法</b>　${a.rule}</div>
  ${a.reads.map(x=>`<div class="read ${x.main?'main':''}"><div class="w">${x.main?'【主】':'【参】'}${x.w}</div><div class="t">${esc(x.t)}</div>${x.x?`<div class="x">象曰：${esc(x.x)}</div>`:''}</div>`).join('')}
  </div>`;
  h+=`<div class="card"><h2>白话解读 · ${a.focus.name}卦</h2>${bhHTML(a.focus)}`;
  const other=a.focus===a.ben?a.zhi:a.ben;
  if(other)h+=`<details><summary>${other===a.zhi?'变卦（事情的走向）':'本卦（目前的处境）'}：${other.name}卦白话</summary>${bhHTML(other)}</details>`;
  h+=`<p class="hint">白话为迫子据卦义所写的通俗参考，凡事还要自己拿主意。</p></div>`;
  h+=`<div class="card"><h2>本卦原文 · ${a.ben.name}</h2>${fullText(a.ben,a.chg)}</div>`;
  if(a.zhi)h+=`<div class="card"><details><summary style="font-size:17px">变卦原文 · ${a.zhi.name}</summary>${fullText(a.zhi)}</details></div>`;
  $('#result').innerHTML=h;
  if(scroll)$('#result').scrollIntoView({behavior:'smooth'});
}

// ---- history ----
function loadHist(){try{return JSON.parse(localStorage.getItem(HKEY))||[]}catch(e){return []}}
function saveHist(r){const a=loadHist();a.unshift(r);localStorage.setItem(HKEY,JSON.stringify(a.slice(0,30)));renderHist();}
function renderHist(){const a=loadHist();
  $('#hist').innerHTML=a.length?a.map((r,i)=>{const x=analyze(r.v);const d=new Date(r.t);
    return `<li><div><div>${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}　${x.ben.name}${x.zhi?' → '+x.zhi.name:''}</div><div class="q">${r.q?esc(r.q):'（未填问题）'}</div></div><button data-i="${i}">查看</button></li>`}).join(''):'<li class="hint">还没有卦例</li>';
  $('#clearHist').classList.toggle('hidden',!a.length);
  document.querySelectorAll('#hist button[data-i]').forEach(b=>b.onclick=()=>showResult(loadHist()[+b.dataset.i],true));}
$('#clearHist').onclick=()=>{if(confirm('确定清空所有卦例？')){localStorage.removeItem(HKEY);renderHist();}};
renderHist();renderBuild();
window.__test={analyze,showResult,G};
